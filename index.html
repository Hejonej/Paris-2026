/* AFIELD INTERACTION SYSTEM — product iteration */
.hero{padding:68px 4px 24px}
.hero h1{max-width:850px}
.hero p{max-width:760px}
.chapter{cursor:pointer;position:relative;transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s ease,border-color .28s ease;background:linear-gradient(135deg,#e8e6e0,#fbfbfa)}
.chapter:not(.new)::after{content:"여행 열기  ↗";position:absolute;right:24px;bottom:23px;font-size:12px;font-weight:800;opacity:0;transform:translateY(5px);transition:.25s ease;color:#222}
.chapter:not(.new):hover{transform:translateY(-3px);box-shadow:0 24px 70px #00000012;border-color:#ffffff}
.chapter:not(.new):hover::after{opacity:1;transform:none}
.chapter:not(.new):active{transform:translateY(-1px) scale(.992);transition-duration:.08s}
.new{min-height:180px}
.new:hover{background:#ffffff70;border-color:#aaa}
.stop{position:relative;border-bottom:0;padding:18px 0 12px}
.stop:after{content:"";position:absolute;left:15px;top:50px;bottom:-8px;width:1px;background:#deded9}
.stop:last-of-type:after{display:none}
.stop h3{font-size:19px}
.stop .what{font-size:12px;color:#6f6f6b;margin:2px 0 5px}
.stop .reason{font-size:13px;color:#343431;line-height:1.45;max-width:720px}
.sourcehint{display:inline-block;margin-top:7px;font-size:10px;color:#969691;letter-spacing:.04em}
.move{margin:2px 0 2px 49px;padding:0}
.moveControl{width:100%;border:0;background:transparent;border-radius:15px;padding:11px 12px;text-align:left;color:#73736f;font-size:12px;transition:.2s ease;display:flex;align-items:center;gap:8px}
.moveControl:hover{background:#f1f1ee;color:#111;padding-left:16px}
.moveControl .reveal{opacity:0;transform:translateX(-4px);transition:.2s ease;font-weight:800}
.moveControl:hover .reveal{opacity:1;transform:none}
.optionalBranch{margin:5px 0 10px 49px;padding:9px 0 4px 18px;border-left:1px solid #d9d7d0}
.optionalLabel{font-size:11px;font-weight:800;letter-spacing:-.02em;color:#777;margin-bottom:8px}
.option{margin:5px 0;padding:10px 12px;border-radius:15px;background:transparent;border:1px solid transparent;transition:.2s ease;align-items:center}
.option:hover{background:#f5f4f0;border-color:#e7e5df}
.option .optTitle{font-size:13px;font-weight:800;color:#353532}
.option .optWhy{font-size:11px;color:#898984;margin-top:3px;line-height:1.4}
.option button{flex:none;transition:.18s ease;cursor:pointer}
.option button:hover{background:#111;color:#fff;border-color:#111;transform:scale(1.05)}
.aiNotice{border:1px solid #e6e2d8;background:linear-gradient(135deg,#f5f2eb,#fff);border-radius:20px;padding:16px;margin-bottom:13px}
.aiNotice .ey{color:#8d7965}.aiNotice h4{margin:7px 0 6px;font-size:16px}.aiNotice p{font-size:12px;color:#6f6b65;line-height:1.5;margin:0}
.aiNotice button{border:0;background:none;padding:10px 0 0;font-weight:850;font-size:12px}
.two{grid-template-columns:minmax(0,1fr) minmax(270px,360px)}
aside{min-width:0}
@media(max-width:720px){
 .chapter:not(.new)::after{opacity:.75;transform:none}
 .optionalBranch{margin-left:42px}
 .move{margin-left:42px}
}


.stop .what{display:inline-flex;align-items:center;width:max-content;padding:5px 8px;border-radius:999px;background:#f2f2ef;color:#555;font-weight:700;margin:2px 0 8px}
.stop .reason{max-width:760px}


/* Atomic itinerary model */
.stop h3{letter-spacing:-.035em}
.stop .what{font-size:11px}
.stop .reason{font-size:12px;color:#666;margin-top:1px}
.moveControl:before{content:"";height:1px;width:22px;background:#d7d7d2;display:inline-block;margin-right:2px}
.moveControl:after{content:"";height:1px;flex:1;background:#ecece8;margin-left:4px}
.moveControl .reveal{order:2}


.areaBrief{background:linear-gradient(135deg,#f4f3ef,#fbfbfa);border:1px solid #eceae4;border-radius:22px;padding:16px 17px;margin-bottom:10px}
.areaBrief h3{font-size:18px;margin:7px 0 7px}
.areaBrief p{font-size:12px;line-height:1.55;color:#676762;margin:0}
.areaChips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.areaChips span,.areaMapLegend span{font-size:10px;font-weight:800;padding:7px 9px;border-radius:999px;background:#fff;border:1px solid #e8e7e2;color:#555}
.areaLine{margin:7px 0 8px;display:flex;flex-direction:column;gap:2px}
.areaLine b{font-size:12px;color:#2f2f2c}
.areaLine span{font-size:11px;line-height:1.4;color:#83837e;max-width:680px}
.optArea{font-size:10px;color:#9a9a95;margin-top:2px}
.areaMapLegend{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0}


/* ===== Mobile-first responsive patch ===== */
@media (max-width: 760px){
  html,body{overflow-x:hidden}
  body{padding-bottom:calc(108px + env(safe-area-inset-bottom))}
  .shell,.app,.page,.wrap,.main,.content{width:100%;max-width:100%;min-width:0}
  .topbar,.hero,.day-tabs,.two,.trip-grid,.route-grid,.content-grid{
    min-width:0 !important;
    width:100% !important;
  }
  .two,.trip-grid,.content-grid{
    display:block !important;
    grid-template-columns:1fr !important;
  }
  .two > *, .trip-grid > *, .content-grid > *{
    width:100% !important;
    max-width:100% !important;
    min-width:0 !important;
  }
  aside,.ai-panel,.side-panel,.right-panel{
    position:static !important;
    width:100% !important;
    max-width:100% !important;
    min-width:0 !important;
    margin-top:16px !important;
  }
  .hero h1{
    font-size:clamp(42px,12vw,68px) !important;
    line-height:.94 !important;
    letter-spacing:-.055em !important;
    overflow-wrap:anywhere;
  }
  .hero p,.lede{max-width:none !important}
  .day-tabs,.date-row,.dates{
    overflow-x:auto !important;
    overflow-y:hidden !important;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    padding-bottom:6px;
  }
  .day-tabs::-webkit-scrollbar,.date-row::-webkit-scrollbar,.dates::-webkit-scrollbar{display:none}
  .day-tab,.date-pill{flex:0 0 auto !important}
  .notice,.noticed,.afield-notice{
    width:100% !important;
    max-width:100% !important;
    margin:14px 0 18px !important;
  }
  .route,.route-list,.day-plan,.plan-column{
    width:100% !important;
    max-width:100% !important;
    min-width:0 !important;
  }
  .place-card,.optional-card,.movement-row,.card{
    max-width:100% !important;
    min-width:0 !important;
    overflow:hidden;
  }
  .place-card *,.optional-card *,.movement-row *,.card *{
    overflow-wrap:anywhere;
  }
  .bottom-nav,.mobile-nav{
    position:fixed !important;
    left:16px !important;
    right:16px !important;
    bottom:calc(12px + env(safe-area-inset-bottom)) !important;
    width:auto !important;
    max-width:none !important;
    z-index:999 !important;
  }
  /* AI should not permanently compete with the route on mobile */
  .ai-panel,.side-panel,.right-panel{
    display:none !important;
  }
  /* modal / review sheet */
  .modal,.dialog,.sheet,.review-modal,.ask-modal{
    padding:10px !important;
    align-items:flex-end !important;
  }
  .modal-card,.dialog-card,.sheet-card,.review-card,.ask-card{
    width:100% !important;
    max-width:100% !important;
    max-height:min(82vh,720px) !important;
    border-radius:28px 28px 18px 18px !important;
    overflow:auto !important;
    -webkit-overflow-scrolling:touch;
  }
}

function splitLegacyStops(items){
  const out=[];
  items.forEach(x=>{
    let title=String(x.title||'').trim();
    let parts=title.split(/\s*→\s*/).map(v=>v.trim()).filter(Boolean);
    // Only split true multi-stop route bundles. Keep slashes and ordinary names untouched.
    if(parts.length<=1){out.push({...x});return}
    parts.forEach((p,idx)=>{
      let clean=p.replace(/\s*체크인$/,'').trim();
      let nx={...x,title:clean,row:Number(String(x.row)+'.'+(idx+1)),_parentRow:x.row,_splitIndex:idx,_splitCount:parts.length};
      if(/체크인/.test(p)){nx.category='stay';nx.doing='Check-in';nx.feature='첫 번째 숙소. 짐을 두고 여행 시작.'}
      else if(/Trocad[eé]ro/i.test(clean)){nx.category='sight';nx.doing='에펠탑 전망 · 산책';nx.feature='에펠탑을 정면으로 볼 수 있는 대표적인 뷰포인트.'}
      else if(/피크닉/.test(clean)){nx.category='sight';nx.doing='피크닉';nx.feature='장 본 음식으로 잠시 쉬어가는 피크닉.'}
      out.push(nx);
    })
  });
  return out;
}

function dayCharacter(core){

function dayAreaSummary(core){

   desc=areas.length?areas.slice(0,3).map(a=>a.desc).join(' '):'메인 루트를 따라 오늘의 동네와 분위기를 한눈에 볼 수 있어요.';

function placeDescriptor(x){
  const title=String(x.title||'');
  if(/Trocad[eé]ro/i.test(title)) return L()==='ko'?'에펠탑 전망 · 산책':'Eiffel view · stroll';
  if(/Floride Etoile/i.test(title)) return L()==='ko'?'숙소 · 체크인':'Stay · check-in';
  if(/Marie-Anne Cantin/i.test(title)) return L()==='ko'?'치즈 전문점':'Cheese shop';
  if(/Maison Bergeron/i.test(title)) return L()==='ko'?'식료품 · 피크닉 장보기':'Grocer · picnic shopping';
  if(/^Buly$/i.test(title)) return L()==='ko'?'향수 · 뷰티 쇼핑':'Beauty · fragrance';
  if(/Grande Épicerie/i.test(title)) return L()==='ko'?'고메 식료품점':'Gourmet grocery';
  return '';
}
function cleanPlannerText(x){
  let f=String(x.feature||'').trim(), d=String(x.doing||'').trim();
  // These are planner/ops notes, not reasons a person saved a place.
  const plannerish=/도보권|이동 최소|휴업|휴무|재확인|영업|쇼핑 핵심|오전$|무리하지|선택$|route|동선/i;
  if(f && !plannerish.test(f)) return f;
  if(d && !plannerish.test(d)) return d;
  return '';
}

 function what(x){let r=roleInfo(x),d=x.district||'';return `${r.emoji} ${r.label}${d?' · '+d:''}`}
 function operationalNote(x){let txt=(x.feature||'');return /재확인|휴업|휴무|영업.*확인|운영.*확인/i.test(txt)}

 function branchFor(x,i){

 let stops=core.map((x,i)=>{let nx=core[i+1],mv=nx?`<div class="move"><button class="moveControl" onclick="route('${J(x.title)}','${J(nx.title)}')"><span>${estimate(x,nx)}</span><span class="reveal">${L()==='ko'?'경로 보기 ›':'View route ›'}</span></button></div>`:'';return`<div class="stop"><div class="n">${i+1}</div><div><h3>${E(x.title)}</h3><div class="what">${E(placeDescriptor(x)||what(x))}</div>${(()=>{let a=areaContext(x);return a.name?`<div class="areaLine"><b>${E(a.name)}</b><span>${E(a.desc)}</span></div>`:''})()}${why(x)?`<div class="reason">${E(why(x))}</div>`:''}${source(x)?`<span class="sourcehint">${E(source(x))}</span>`:''}</div>${P(x)==='MUST'?'<span class="tag">MUST</span>':''}</div>${branchFor(x,i)}${mv}`}).join('');
 let ended=z==='ended'?`<div class="panel" style="margin-top:15px"><h3>Your trip has ended.</h3><p class="small">Close the chapter when you are ready to turn planning traces into a journal.</p><button class="btn black" onclick="closeFlow()">Close chapter</button></div>`:'';
 let conflict=(day==='9/19 토'&&c.flights.some(f=>(f.arrive||'').includes('2026-09-19T17:20')))?`<div class="aiNotice"><div class="ey">AFIELD NOTICED SOMETHING</div><h4>${L()==='ko'?'첫날 일정이 너무 빡빡해 보여요.':'Your first day may be too full.'}</h4><p>${L()==='ko'?'OZ501이 CDG에 17:20 도착해요. 입국·수하물·이동을 고려하면 호텔 도착은 저녁이 될 가능성이 높아, 낮 일정은 다른 날로 옮기는 편이 자연스러워요.':'OZ501 lands at CDG at 17:20. Immigration, baggage and transfer make daytime stops unrealistic.'}</p><button onclick="ask()">Review changes →</button></div>`:'';
 $('#view').innerHTML=`<section class="chapterHead"><div><div class="ey">${c.city} · ${F(c.start)}—${F(c.end)}</div><h1>${z==='traveling'?(L()==='ko'?'오늘, 어디로 갈까요.':'Good morning.'):E(c.title)}</h1><div class="sub">${z==='traveling'?'Afield keeps your next route ready.':(L()==='ko'?'장소 이름만이 아니라, 왜 저장했는지까지 함께 보며 하루를 만들어요.':'Build each day around why a place mattered to you, not distance alone.')}</div></div><button class="btn gray" onclick="setup()">••• Trip setup</button></section><div class="days">${ds.map(d=>`<button class="day ${d===day?'on':''}" onclick="day='${J(d)}';renderChapter()"><b>${d.split(' ')[1]}</b><small>${d.split(' ')[0]}</small></button>`).join('')}</div><div class="two"><section class="panel"><div class="ey">DAY PLAN · ${E(day)}</div>${(()=>{let ds=dayAreaSummary(core);return `<div class="areaBrief"><div class="ey">${L()==='ko'?'오늘의 동네':'TODAY’S AREAS'}</div><h3>${E(ds.title)}</h3><p>${E(ds.desc)}</p><div class="areaChips">${ds.names.map(n=>`<span>${E(n)}</span>`).join('')}</div></div>`})()}<h3 style="margin:18px 0 8px">${L()==='ko'?'오늘의 흐름':'Your route'}</h3><p class="small" style="margin:0 0 18px">${L()==='ko'?'번호 하나가 한 장소예요. 장소 사이의 이동을 누르면 경로를 볼 수 있어요.':'One number, one place. Tap the movement between stops to see the route.'}</p>${stops||'<div class="notice">No itinerary yet.</div>'}</section><aside>${conflict}<div class="panel"><div class="ey">${z==='traveling'?'NEXT':'AFIELD AI'}</div><h3>${z==='traveling'?(core[1]?.title||core[0]?.title||'Next stop'):(L()==='ko'?'일정에 여백을 만들어요':'Make the plan breathe')}</h3><p class="small">${z==='traveling'?'See the next route without rebuilding it in another app.':(L()==='ko'?'영업시간, 식사 리듬, 우선순위와 실제 이동을 함께 봅니다.':'Opening hours, priority, meal rhythm and route are considered together.')}</p><button class="ask" onclick="ask()"><span>✦ ${t('ask')}</span><span>→</span></button></div>${ended}</aside></div>`}
function P(x){let s=((x.feature||'')+' '+(x.doing||'')).toUpperCase();return s.includes('MUST')?'MUST':x.core?'ROUTE':'OPTION'}
function estimate(a,b){
  let raw=((Number(a.row)||1)*7+(Number(b.row)||2)*11)%18+7;
  let mins=Math.max(1,Math.round(raw));
  return L()==='ko'?`🚶 약 ${mins}분`:`🚶 about ${mins} min`;
}
function promote(r){
  let x=C().itinerary.find(q=>q.row===r);
  if(x)x.core=true;
  save();
  renderChapter();
}
function places(){let c=C();$('#view').innerHTML=`<section class="chapterHead"><div><div class="ey">${c.city}</div><h1>${t('places')}<span class="soft">.</span></h1><div class="sub">${L()==='ko'?'장소보다 중요한 건, 왜 그곳을 저장했는지예요.':'The reason you saved a place stays with it.'}</div></div></section><div class="places">${c.itinerary.map(x=>`<article class="place" onclick="place(${x.row})"><div class="ey">${E(x.category||'PLACE')} · ${E(x.district||'')}</div><h3>${E(x.title)}</h3><p class="small">${E(x.doing||'')}</p><div class="why"><b>${t('why')}</b><br>${E(x.feature||x.doing||'')}<br><span class="sourcehint">${/instagram|reel|릴스/i.test((x.feature||'')+' '+(x.doing||''))?'Instagram source saved':'Saved for this trip'}</span></div></article>`).join('')}</div>`}function place(r){let x=C().itinerary.find(q=>q.row===r);M(`<div class="ey">${E(x.category||'PLACE')} · ${E(x.district||'')}</div><h2>${E(x.title)}</h2><p>${E(x.doing||'')}</p><div class="panel" style="box-shadow:none"><div class="ey">${t('why')}</div><p>${E(x.feature||'')}</p></div><div class="actions"><button class="btn gray" onclick="X()">Done</button><button class="btn black" onclick="route('Current location','${J(x.title)}')">${t('directions')}</button></div>`)}
function map(){let c=C();$('#view').innerHTML=`<div class="areaMapLegend">${AREA_CONTEXTS.slice(0,7).map(a=>`<span>${E(L()==='ko'?a.nameKo:a.nameEn)}</span>`).join('')}</div><section class="chapterHead"><div><div class="ey">${c.city}</div><h1>${t('map')}<span class="soft">.</span></h1><div class="sub">${L()==='ko'?'여행 전체의 공간감을 보는 지도예요. 실제 이동은 Today 안의 구간별 길찾기에서 이어집니다.':'See the shape of the trip. Segment directions live inside Today.'}</div></div></section><div class="map"><iframe src="https://www.openstreetmap.org/export/embed.html?bbox=2.20%2C48.80%2C2.45%2C48.92&layer=mapnik"></iframe><div class="hud"><div><b>${E(c.city)} chapter</b><div class="small">${c.itinerary.length} itinerary items</div></div><button class="btn black" onclick="window.open('https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c.city)}','_blank')">Open map ↗</button></div></div>`}
function route(fr,to){let min=(fr.length*3+to.length*5)%17+8,g='https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(fr)+'&destination='+encodeURIComponent(to)+'&travelmode=walking';M(`<div class="ey">DIRECTIONS</div><h2>${E(fr)} →<br>${E(to)}</h2><div class="modes"><button class="on">🚶 Walk</button><button>🚇 Transit</button><button>🚕 Taxi</button></div><div class="route"><strong>≈ ${min} min</strong><div class="small">Route preview. Live Google Routes data is the next backend integration; this build does not pretend an estimate is live.</div></div><div class="notice">${L()==='ko'?'Google Maps로 넘길 때 출발지, 목적지, 도보 모드를 미리 입력해 한 번의 탭으로 길찾기를 시작해요.':'One tap hands off to Google Maps with origin, destination and walking mode already filled.'}</div><div class="actions"><button class="btn gray" onclick="X()">Close</button><button class="btn black" onclick="window.open('${g}','_blank')">Open in Google Maps ↗</button></div>`)}
let AI_REVIEW={items:[],i:0,decisions:{},timer:null,started:0};
function ask(){M(`<div class="ey">ASK AFIELD</div><h2>${L()==='ko'?'무엇을 바꾸고 싶나요?':'What would you like to change?'}</h2><div class="field"><textarea id="prompt" placeholder="${L()==='ko'?'예: 첫날은 가볍게, 쇼핑은 줄이고 미술관을 우선해줘.':'e.g. Make the first day lighter and prioritize art.'}"></textarea></div><div id="ast" class="small">${L()==='ko'?'변경사항은 하나씩 확인한 뒤에만 반영돼요.':'Nothing changes until you approve it.'}</div><div id="ares"></div><div class="actions"><button class="btn gray" onclick="X()">${L()==='ko'?'닫기':'Close'}</button><button id="ab" class="btn black" onclick="runAI()">✦ ${L()==='ko'?'Afield와 계획하기':'Plan with Afield'}</button></div>`)}
function loadingCopy(step){let ko=['전체 일정과 숙소·항공편을 함께 보고 있어요.','저장한 장소와 하루의 리듬을 맞추고 있어요.','동선과 우선순위를 비교하고 있어요.','조금 더 자연스러운 하루로 정리하고 있어요.'];let en=['Looking across your full chapter, stays and flights.','Balancing saved places with the rhythm of each day.','Comparing routes and priorities.','Shaping the days into a more natural flow.'];return (L()==='ko'?ko:en)[Math.min(step,3)]}
function showAILoading(){let st=$('#ast'),r=$('#ares');AI_REVIEW.started=Date.now();st.innerHTML=`<div class="aiThinking" id="aiThink">${loadingCopy(0)}</div><div class="aiProgress"><i></i></div>`;r.innerHTML='';let step=0;clearInterval(AI_REVIEW.timer);AI_REVIEW.timer=setInterval(()=>{step=Math.min(step+1,3);let x=$('#aiThink');if(x)x.textContent=loadingCopy(step)},2200)}
function normalizeSuggestion(x,i){let title=x.title||x.action||x.change||x.suggestion||(L()==='ko'?`제안 ${i+1}`:`Suggestion ${i+1}`);let reason=x.reason||x.why||x.explanation||'';let before=x.before||x.current||x.from||'';let after=x.after||x.proposed||x.to||x.result||x.change||x.action||'';return {raw:x,title:String(title),reason:String(reason),before:typeof before==='string'?before:JSON.stringify(before),after:typeof after==='string'?after:JSON.stringify(after)}}
function renderSuggestion(){let a=AI_REVIEW.items,i=AI_REVIEW.i;if(!a.length)return;if(i>=a.length)return renderReviewSummary();let x=a[i];$('#ast').innerHTML=`<div class="reviewTop"><div class="reviewCount">${i+1} / ${a.length}</div><div class="reviewBar"><i style="width:${((i+1)/a.length)*100}%"></i></div></div>`;let changes='';if(x.before)changes+=`<div class="changeBox"><div class="changeLabel">${L()==='ko'?'현재':'CURRENT'}</div><div class="changeText">${E(x.before)}</div></div>`;if(x.after)changes+=`<div class="changeBox"><div class="changeLabel">${L()==='ko'?'바꾸면':'IF CHANGED'}</div><div class="changeText">${E(x.after)}</div></div>`;$('#ares').innerHTML=`<div class="sugCard"><div class="ey">${L()==='ko'?'AFIELD의 제안':'AFIELD SUGGESTS'}</div><h3>${E(x.title)}</h3>${x.reason?`<div class="sugReason">${E(x.reason)}</div>`:''}${changes}<div class="choiceRow"><button onclick="decideAI('keep')">${L()==='ko'?'그대로 둘게요':'Keep mine'}</button><button class="accept" onclick="decideAI('accept')">${L()==='ko'?'이렇게 바꾸기':'Accept change'}</button></div></div>`;let b=$('#ab');b.disabled=false;b.textContent=L()==='ko'?'다음에 결정할게요':'Decide later';b.onclick=()=>{AI_REVIEW.decisions[i]='skip';AI_REVIEW.i++;renderSuggestion()}}
function decideAI(v){AI_REVIEW.decisions[AI_REVIEW.i]=v;AI_REVIEW.i++;renderSuggestion()}
function renderReviewSummary(){let accepted=Object.values(AI_REVIEW.decisions).filter(x=>x==='accept').length,kept=Object.values(AI_REVIEW.decisions).filter(x=>x==='keep').length;$('#ast').innerHTML=`<div class="ey">REVIEW CHANGES</div><h3 style="font-size:24px;margin:8px 0">${L()==='ko'?`${accepted}가지를 바꿀게요.`:`${accepted} changes ready.`}</h3><div class="small">${L()==='ko'?`${kept}가지는 지금 일정 그대로 유지해요.`:`${kept} suggestions will keep your original plan.`}</div>`;$('#ares').innerHTML=`<div class="reviewSummary">${AI_REVIEW.items.map((x,i)=>`<div class="reviewItem"><b>${AI_REVIEW.decisions[i]==='accept'?'✓':'—'} ${E(x.title)}</b><div class="small">${AI_REVIEW.decisions[i]==='accept'?(L()==='ko'?'반영':'Accepted'):(L()==='ko'?'유지':'Kept')}</div></div>`).join('')}</div><div class="applyNote">${L()==='ko'?'현재 프로토타입에서는 승인 내역을 안전하게 저장하고, 실제 일정 자동 수정은 다음 연결 단계에서 적용돼요.':'This prototype records your approvals; itinerary mutation is the next integration step.'}</div>`;let b=$('#ab');b.disabled=accepted===0;b.textContent=L()==='ko'?'선택한 변경사항 적용':'Apply selected changes';b.onclick=applyAIChoices}
function applyAIChoices(){let c=C();c.aiDecisions={at:new Date().toISOString(),suggestions:AI_REVIEW.items.map((x,i)=>({title:x.title,decision:AI_REVIEW.decisions[i]||'skip',raw:x.raw}))};save();$('#ast').innerHTML=`<b>${L()==='ko'?'선택을 저장했어요.':'Choices saved.'}</b><div class="small">${L()==='ko'?'승인한 제안만 반영 대상으로 남겨뒀어요.':'Only approved suggestions are marked for application.'}</div>`;$('#ares').innerHTML='';let b=$('#ab');b.disabled=true;b.textContent='✓ '+(L()==='ko'?'검토 완료':'Review complete')}
async function runAI(){let c=C(),b=$('#ab');b.disabled=true;b.textContent='Planning…';showAILoading();let gr={};c.itinerary.forEach(x=>(gr[x.date]??=[]).push({id:String(x.row),order:x.row,date:x.date,title:x.title,doing:x.doing,feature:x.feature,district:x.district,category:x.category,priority:P(x),routeStatus:x.core?'ROUTE':'OPTIONAL'}));try{let r=await fetch(WORKER+'/plan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({trip:{title:c.title,city:c.city,start:c.start,end:c.end,flights:c.flights,stays:c.stays},itinerary:Object.entries(gr).map(([date,items])=>({date,items})),places:c.itinerary.map(x=>({id:String(x.row),name:x.title,priority:P(x),category:x.category,notes:x.feature||x.doing||''})),request:$('#prompt').value,protectMust:true,verifyHours:true,reviewMode:true,outputPreference:'Return atomic, user-reviewable suggestions. For each suggestion include title, reason, before, and after whenever possible.'})});if(!r.ok)throw Error('HTTP '+r.status);let j=await r.json(),a=(j.suggestions||[]).map(normalizeSuggestion);clearInterval(AI_REVIEW.timer);AI_REVIEW={items:a,i:0,decisions:{},timer:null,started:AI_REVIEW.started};if(!a.length)throw Error(L()==='ko'?'제안이 없어요.':'No suggestions returned.');renderSuggestion()}catch(e){clearInterval(AI_REVIEW.timer);$('#ast').textContent=(L()==='ko'?'Afield AI에 연결하지 못했어요: ':'Could not reach Afield AI: ')+e.message;b.disabled=false;b.textContent='✦ '+(L()==='ko'?'Afield와 계획하기':'Plan with Afield');b.onclick=runAI}}
function newC(){M(`<div class="ey">NEW CHAPTER</div><h2>Give this trip a name.</h2><div class="field"><label>CHAPTER NAME</label><input id="nt" placeholder="e.g. Summer in Copenhagen"></div><div class="row"><div class="field"><label>CITY</label><input id="nc"></div><div class="field"><label>COUNTRY</label><input id="nco"></div></div><div class="row"><div class="field"><label>START</label><input id="ns" type="date"></div><div class="field"><label>END</label><input id="ne" type="date"></div></div><div class="actions"><button class="btn gray" onclick="X()">Cancel</button><button class="btn black" onclick="createC()">Create chapter</button></div>`)}function createC(){let o={id:'c'+Date.now(),title:$('#nt').value,city:$('#nc').value,country:$('#nco').value,start:$('#ns').value,end:$('#ne').value,status:'planning',flights:[],stays:[],itinerary:[],shopping:[],master:[],journal:null,visited:{}};if(!o.title||!o.city||!o.start||!o.end)return alert('Complete name, city and dates.');S.chapters.unshift(o);save();X();openC(o.id);setup()}
function closeFlow(){M(`<div class="ey">${E(C().city)}</div><h2>Your trip is complete.</h2><p class="sub">Afield can turn confirmed visits and planning traces into a quiet journal.</p><div class="notice">Afield will not invent visits. Planned-only places remain planning memories unless you marked them visited.</div><div class="field"><label>JOURNAL LANGUAGE</label><select id="jl"><option value="ko">한국어</option><option value="en">English</option></select></div><div class="actions"><button class="btn gray" onclick="X()">Keep editing</button><button class="btn black" onclick="closeC()">Close chapter</button></div>`)}function closeC(){let c=C(),ds=[...new Set(c.itinerary.map(x=>x.date))];c.status='remembered';c.journal={days:ds.map((d,i)=>({day:i+1,date:d,title:i?'천천히 이어진 하루':'도착, 그리고 여행의 시작',body:c.itinerary.filter(x=>x.date===d&&x.core).slice(0,4).map(x=>x.title).join(', ')+' — 계획하며 남겨둔 이유와 실제 방문 확인을 바탕으로 이 날의 기록이 완성됩니다.'}))};save();X();tab='journal';render()}
function journal(){let c=C();$('#view').innerHTML=`<section class="chapterHead"><div><div class="ey">${c.city} · REMEMBERED</div><h1>${E(c.title)}</h1><div class="sub">${c.journal?'A trip you can return to.':'This chapter has not been closed yet.'}</div></div></section><div class="journal">${c.journal?c.journal.days.map(d=>`<article><div class="ey">DAY ${d.day} · ${E(d.date)}</div><h2>${E(d.title)}</h2><div>${E(d.body)}</div></article>`).join(''):'<div class="panel"><div class="notice">No journal yet.</div></div>'}</div>`}
function saveSheet(){M(`<div class="ey">SAVED INBOX</div><h2>Save for later.</h2><div class="field"><label>PLACE OR LINK</label><input id="sv"></div><div class="field"><label>WHY SAVE IT?</label><textarea id="sw"></textarea></div><div class="actions"><button class="btn gray" onclick="X()">Cancel</button><button class="btn black" onclick="S.saved.push({value:$('#sv').value,why:$('#sw').value});save();X();render()">Save</button></div>`)}
function M(x){$('#modal').innerHTML=`<div class="sheetback" onclick="if(event.target===this)X()"><div class="sheet">${x}</div></div>`}function X(){$('#modal').innerHTML=''}function E(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function A(s){return E(s).replace(/"/g,'&quot;')}function J(s){return String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")}function F(s){if(!s)return'';return new Date(s.length===10?s+'T00:00':s).toLocaleDateString(L()==='ko'?'ko-KR':'en-US',{month:'short',day:'numeric',year:'numeric'})}render();
</script></body></html>
