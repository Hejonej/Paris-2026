function readIG(file){
 if(!file)return;
 if(!/\.json$/i.test(file.name)){alert('JSON 파일을 선택해주세요.');return}
 let r=new FileReader();
 r.onload=()=>{try{
 let clean=String(r.result||'').replace(/^\uFEFF/,'').trim();
 let raw=JSON.parse(clean);
 IG_FILE_NAME=file.name;
 let exact=parseInstagramCollections(raw);
 if(exact.length){IG_COLLECTIONS=exact;renderIGCollections(file.name);return}
 IG_IMPORT=parseInstagramJSON(raw).map(x=>({...x,category:guessCategory(x)}));
 renderIGPreview(file.name);
}catch(e){
 let p=$('#igPreview');
 if(p)p.innerHTML=`<div class="notice"><b>이 파일을 읽지 못했어요.</b><p class="small">Instagram에서 내려받은 saved collections JSON을 그대로 선택해주세요.</p></div>`;
}};
 r.readAsText(file);
}
function walkJSON(v,path='',out=[]){
 if(Array.isArray(v))v.forEach((x,i)=>walkJSON(x,path+'/'+i,out));
 else if(v&&typeof v==='object'){out.push({v,path});Object.keys(v).forEach(k=>walkJSON(v[k],path+'/'+k,out))}
 return out;
}
function cleanIGText(x){return String(x||'').replace(/\s+/g,' ').trim()}

function repairIGText(v){
 if(typeof v!=='string')return v;
 try{
   let bytes=Uint8Array.from([...v].map(ch=>ch.charCodeAt(0)));
   let fixed=new TextDecoder('utf-8',{fatal:true}).decode(bytes);
   if(fixed && !fixed.includes('�'))return fixed;
 }catch(e){}
 return v;
}
function lvLabel(x){return repairIGText(x&&x.label||'')}
function lvValue(x){return repairIGText(x&&x.value||'')}
function findLV(arr,label){return (arr||[]).find(x=>lvLabel(x)===label)}
function nestedValues(node,out=[]){
 if(!node||typeof node!=='object')return out;
 if(Array.isArray(node)){node.forEach(x=>nestedValues(x,out));return out}
 if(node.label||node.value||node.href)out.push({label:lvLabel(node),value:lvValue(node),href:node.href||''});
 Object.values(node).forEach(v=>{if(v&&typeof v==='object')nestedValues(v,out)});
 return out;
}
function parseInstagramPost(node){
 let vals=nestedValues(node,[]);
 let ig=vals.find(x=>/instagram\.com\/(reel|p)\//i.test(x.href||x.value||''));
 if(!ig)return null;
 let captions=vals.filter(x=>x.label==='캡션' && x.value).map(x=>x.value);
 let caption=captions.sort((a,b)=>b.length-a.length)[0]||'';
 let owner=vals.find(x=>x.label==='이름' && x.value && !/^https?:/i.test(x.value));
 let username=vals.find(x=>x.label==='사용자 이름' && x.value);
 let first=(caption.split(/\n+/).find(Boolean)||'').replace(/\s+/g,' ').trim();
 let title=(owner&&owner.value)||('@'+(username&&username.value||''))||first.slice(0,72)||'Instagram saved item';
 return {name:title,why:caption,source:ig.href||ig.value,owner:owner&&owner.value||'',username:username&&username.value||'',caption,category:guessCategory({name:title,why:caption})};
}
function parseInstagramCollections(raw){
 let candidates=walkJSON(raw).map(x=>x.v),cols=[],seen=new Set();
 for(const col of candidates){
   if(!col||!Array.isArray(col.label_values))continue;
   let nameItem=findLV(col.label_values,'이름')||findLV(col.label_values,'Name');
   if(!nameItem||!nameItem.value)continue;
   let posts=nestedValues(col,[]); // quick signal that this object actually contains Instagram URLs
   if(!posts.some(x=>/instagram\.com\/(reel|p)\//i.test(x.href||x.value||'')))continue;
   let parsed=[];
   walkJSON(col).forEach(({v})=>{let p=parseInstagramPost(v);if(p&&!parsed.some(x=>x.source===p.source))parsed.push(p)});
   let key=lvValue(nameItem);
   if(parsed.length&&!seen.has(key)){seen.add(key);cols.push({name:key,posts:parsed})}
 }
 return cols;
}

 $('#igPreview').innerHTML=`<div class="ey">COLLECTIONS</div><h2>어떤 Collection을 가져올까요?</h2><p class="small"><b>${escIG(filename)}</b>에서 ${IG_COLLECTIONS.length}개의 Collection을 찾았어요. 이 Chapter와 관련된 Collection을 골라주세요.</p><div class="collectionList">${IG_COLLECTIONS.map((c,i)=>`<button class="collectionRow" onclick="chooseIGCollection(${i})"><b>${escIG(c.name)}</b><span>${c.posts.length}개 저장 항목 →</span></button>`).join('')}</div>`;
}
function chooseIGCollection(i){

 renderIGPreview(`${IG_FILE_NAME} · ${c.name}`);
}
function parseInstagramJSON(raw){
 let nodes=walkJSON(raw), found=[];
 for(const {v,path} of nodes){
   let title=cleanIGText(v.title||v.name||v.place_name||v.location_name||v.venue_name);
   let href=cleanIGText(v.href||v.url||v.link);
   let value=cleanIGText(v.value||v.text||v.caption);
   let ts=v.timestamp||v.time||v.created_at||'';
   // Instagram exports often nest string_list_data entries under a titled object.
   if(title && Array.isArray(v.string_list_data)){
     let first=v.string_list_data[0]||{};
     href=cleanIGText(first.href||href); value=cleanIGText(first.value||value); ts=first.timestamp||ts;
     found.push({name:title,source:href,why:value,when:ts,path});
   } else if(title && (href||value||/saved|collection|place|location/i.test(path))){
     found.push({name:title,source:href,why:value,when:ts,path});
   }
 }
 // Also support lightweight user-created exports: [{name/title, url/href, why/reason}]
 if(Array.isArray(raw)) raw.forEach((v,i)=>{if(v&&typeof v==='object'){let n=cleanIGText(v.name||v.title);if(n)found.push({name:n,source:cleanIGText(v.url||v.href||v.source),why:cleanIGText(v.why||v.reason||v.note),when:v.timestamp||'',path:'/root/'+i})}});

 if(!raw.length){onProgress?.({done:0,total:0,matched:0,unmatched:0,failed:0});return {matched:0,unmatched:0,failed:0,total:0}}

   let payload={city:c.city,country:c.country,places:batch.map((g,i)=>({clientIndex:i,name:g.query.name,category:g.query.category||'Other',sourcePost:g.query.sourcePost||''}))};

           Object.assign(p,{name:r.match.displayName||p.name,placeId:r.match.placeId,address:r.match.formattedAddress||'',lat:r.match.location?.latitude??null,lng:r.match.location?.longitude??null,googleMapsUri:r.match.googleMapsUri||'',primaryType:r.match.primaryType||'',category:smartType({primaryType:r.match.primaryType,name:r.match.displayName,category:p.category}),businessStatus:r.match.businessStatus||'',regularOpeningHours:r.match.regularOpeningHours||null,timeZone:r.match.timeZone||null,placeStatus:'google_matched',matchConfidence:r.confidence||'matched'});

     });

   }catch(e){

}

 if(a&&b)out.push({t:'저장한 장소를 가까운 흐름으로 묶어볼까요?',why:'실시간 경로는 아직 연결 전이라 확정 동선이 아니라 검토용 제안이에요.',before:`${a} / ${b} 개별 저장`,after:`두 장소를 같은 날 후보로 검토`});
 return out.length?out:[{t:'아직 일정 제안에 필요한 정보가 적어요.',why:'장소 1곳만 있어도 계획은 시작할 수 있지만, 빈 시간대가 생길 수 있어요.',before:'현재 저장 정보 유지',after:'빈 시간은 열어둔 초안 만들기'}];
}
function review(){ri=0;decisions=[];sugg=buildSuggestions();renderReview()}
function renderReview(){let s=sugg[ri];modal(`<div class="ey">AFIELD SUGGESTS · ${ri+1}/${sugg.length}</div><div class="reviewbar"><i style="width:${(ri+1)/sugg.length*100}%"></i></div><div class="suggest"><h2>${s.t}</h2><p class="small">${s.why}</p><div class="beforeafter"><div class="ba"><div class="ey">현재</div>${s.before}</div><div class="ba"><div class="ey">바꾸면</div>${s.after}</div></div></div><div class="actions"><button class="choice" onclick="choose(false)">그대로 둘게요</button><button class="choice black" onclick="choose(true)">이렇게 바꾸기</button></div>`)}
function choose(v){decisions.push(v);ri++;if(ri<sugg.length)renderReview();else modal(`<div class="ey">REVIEW CHANGES</div><h2>${decisions.filter(Boolean).length}가지를 바꿀게요.</h2><p class="lead">수용한 제안만 일정에 반영해요. 고집하고 싶은 일정은 그대로 남겨둬요.</p><div class="actions"><button class="btn" onclick="review()">다시 보기</button><button class="btn primary" onclick="applyPlan()">변경사항 적용</button></div>`)}
function applyPlan(){let c=C();if(!c.plan)c.plan=makeLocalPlan(c);c.planned=true;ACTIVE_DAY=0;save();closeM();chapter()}
function toggleReminder(el,key){let c=C();c.reminders=c.reminders||{};c.reminders[key]=!(c.reminders[key]!==false);el.classList.toggle('on',c.reminders[key]);save()}
function directions(a,b){
 a=decodeURIComponent(a);b=decodeURIComponent(b);
 let g=`https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(a)}&destination=${encodeURIComponent(b)}`;
 modal(`<div class="ey">DIRECTIONS</div><h2>${esc(a)} → ${esc(b)}</h2><div class="modebar"><button class="on" onclick="mode(this,'도보')">🚶 도보</button><button onclick="mode(this,'대중교통')">🚇 대중교통</button><button onclick="mode(this,'택시')">🚕 택시</button></div><div class="map" id="rmap">Afield route · Google Routes</div><p class="small" id="rmeta">일정 카드의 이동시간은 Google Routes 계산값이에요. 상세 경로는 Google Maps로 이어서 볼 수 있어요.</p><button class="btn primary" onclick="window.open('${g}','_blank')">Google Maps에서 열기 ↗</button>`);
}
function mode(el,m){document.querySelectorAll('.modebar button').forEach(x=>x.classList.remove('on'));el.classList.add('on');$('#rmap').textContent='Afield route · '+m;$('#rmeta').textContent=m+' 모드 · 상세 경로는 Google Maps에서 이어서 확인해요.'}
home();
</script></body></html>
