<style>

*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Apple SD Gothic Neo","Noto Sans KR",sans-serif}button,input{font:inherit}button{cursor:pointer}
.wrap{max-width:1180px;margin:auto;padding:28px 28px 130px}.top{height:92px;border:1px solid #e8e8e3;border-radius:30px;background:#ffffffc9;backdrop-filter:blur(24px);display:grid;grid-template-columns:54px 1fr 54px;align-items:center;gap:14px;padding:0 20px;position:sticky;top:16px;z-index:20;box-shadow:0 16px 50px #00000008}.logo{font-size:34px;font-weight:820;letter-spacing:-.055em}.navIcon{width:54px;height:54px;border:0;border-radius:50%;background:#efefec;display:grid;place-items:center;padding:0;transition:transform .12s ease,background .15s ease,box-shadow .15s ease}.navIcon:hover{background:#e7e7e3;box-shadow:0 8px 24px #0000000d}.navIcon:active{transform:scale(.93)}.navIcon svg{width:24px;height:24px;stroke:#111;stroke-width:2.15;fill:none;stroke-linecap:round;stroke-linejoin:round}.backIcon{background:#111}.backIcon svg{stroke:#fff;width:27px;height:27px}.navSpacer{width:54px;height:54px}.pill{border:0;border-radius:999px;padding:14px 20px;background:#ededeb;font-weight:750}.black{background:#080808;color:#fff}.hero{padding:76px 4px 34px}.ey{font-size:12px;letter-spacing:.24em;font-weight:800;color:#92928e;text-transform:uppercase}.hero h1{font-size:clamp(54px,7vw,92px);line-height:.91;letter-spacing:-.065em;margin:15px 0 22px;max-width:980px}.hero p{font-size:20px;color:#74746f;line-height:1.55;max-width:720px}.chapters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.chapter{border:1px solid var(--line);background:#fff;border-radius:30px;padding:28px;min-height:250px;position:relative;overflow:hidden;transition:.2s}.chapter:hover{transform:translateY(-3px);box-shadow:0 25px 70px #0001}.chapter:active,.btn:active,.choice:active{transform:scale(.975)}.chapter h2{font-size:38px;line-height:1;letter-spacing:-.05em;margin:12px 0}.small{font-size:13px;color:#858581;line-height:1.5}.screen{max-width:820px;margin:42px auto}.progress{display:flex;gap:7px;margin:20px 0 44px}.progress i{height:5px;flex:1;background:#dfdfda;border-radius:10px}.progress i.on{background:#111}.screen h1{font-size:56px;letter-spacing:-.055em;line-height:.98;margin:10px 0 16px}.screen .lead{font-size:18px;line-height:1.55;color:#777772;margin-bottom:30px}.field{margin:18px 0}.field label{display:block;font-size:12px;font-weight:800;letter-spacing:.14em;color:#8d8d88;margin:0 0 9px}.input{width:100%;border:1px solid #dcdcd6;background:#fff;border-radius:20px;padding:18px 20px;font-size:20px;outline:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.actions{display:flex;gap:12px;margin-top:34px}.btn{border:0;border-radius:999px;padding:17px 24px;font-weight:800;transition:.12s;background:#e9e9e6}.btn.primary{background:#090909;color:#fff;flex:1}.optional{border:1px solid var(--line);border-radius:24px;background:#fff;padding:20px;margin:13px 0}.optional h3{margin:4px 0 7px;font-size:22px;letter-spacing:-.035em}.optional .add{margin-top:15px;border:1px solid #ddd;border-radius:999px;background:#fff;padding:11px 15px;font-weight:750}.citybox{position:relative}.results{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid #ddd;border-radius:18px;overflow:hidden;z-index:30;box-shadow:0 20px 55px #0002}.result{display:block;width:100%;text-align:left;border:0;background:#fff;padding:14px 18px}.result:hover{background:#f1f1ee}.hidden{display:none!important}.placeSearch{display:flex;gap:10px}.savedList{display:grid;gap:10px;margin:22px 0}.saved{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);background:#fff;border-radius:20px;padding:16px 18px}.saved b{display:block}.why{font-size:12px;color:#777;margin-top:3px}.import{margin-top:30px;border-top:1px solid var(--line);padding-top:26px}.importCard{border:1px solid var(--line);background:#fff;border-radius:24px;padding:22px}.importCard h3{font-size:22px;margin:3px 0 7px}.chapterHead{padding:56px 0 20px}.chapterHead h1{font-size:64px;letter-spacing:-.06em;line-height:.94;margin:12px 0}.tabs{display:flex;gap:8px;margin:24px 0}.tabs button{border:0;border-radius:999px;padding:12px 18px;background:#e9e9e6;font-weight:800}.tabs .on{background:#090909;color:#fff}.dates{display:flex;gap:10px;overflow:auto;padding:4px 0 14px}.date{flex:0 0 100px;border:1px solid var(--line);background:#fff;border-radius:20px;padding:14px;text-align:center}.date.on{background:#111;color:#fff}.brief,.notice{border:1px solid var(--line);border-radius:24px;background:#fff;padding:22px;margin:14px 0}.brief h2,.notice h2{font-size:27px;letter-spacing:-.04em;margin:7px 0}.routeCard{background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px;margin:10px 0}.move{border:0;background:transparent;color:#5d5d59;font-weight:750;padding:12px 6px}.map{height:300px;border-radius:24px;background:linear-gradient(135deg,#e8e8e2,#d9ddd8);display:flex;align-items:center;justify-content:center;color:#74746f;margin:18px 0}.bottom{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:40;background:#f1f1eef0;backdrop-filter:blur(24px);border:1px solid #fff;border-radius:999px;padding:7px;display:flex;box-shadow:0 15px 50px #0002}.bottom button{border:0;background:transparent;padding:13px 30px;border-radius:999px;font-weight:800;color:#777}.bottom .on{background:#090909;color:#fff}.modal{position:fixed;inset:0;background:#0006;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}.sheet{width:min(720px,100%);max-height:88vh;overflow:auto;background:#fbfbf9;border-radius:34px;padding:30px}.modebar{display:flex;gap:8px}.modebar button{border:0;border-radius:999px;padding:11px 15px}.modebar .on{background:#111;color:#fff}.suggest{border:1px solid var(--line);border-radius:24px;padding:20px;background:#fff}.beforeafter{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.ba{background:#f0f0ed;border-radius:18px;padding:14px}.choice{border:0;border-radius:999px;padding:14px 18px;font-weight:800}.reviewbar{height:5px;background:#e1e1dc;border-radius:10px;overflow:hidden;margin:14px 0 25px}.reviewbar i{display:block;height:100%;background:#111}
@media(max-width:760px){.wrap{padding:18px 18px 120px}.top{height:76px;border-radius:25px;grid-template-columns:48px 1fr 48px;padding:0 14px}.logo{font-size:30px}.navIcon{width:48px;height:48px}.navSpacer{width:48px;height:48px}.hero{padding:60px 4px 28px}.hero h1{font-size:56px}.hero p{font-size:17px}.chapters{grid-template-columns:1fr}.screen{margin:30px 0}.screen h1{font-size:44px}.row{grid-template-columns:1fr}.chapterHead{padding-top:42px}.chapterHead h1{font-size:50px}.bottom{left:16px;right:16px;transform:none;justify-content:space-between;bottom:calc(12px + env(safe-area-inset-bottom))}.bottom button{padding:12px 20px}.modal{align-items:flex-end;padding:8px}.sheet{border-radius:30px 30px 18px 18px;max-height:84vh}.beforeafter{grid-template-columns:1fr}.map{height:240px}}

.importDrop{border:1.5px dashed #cfcfc8;border-radius:24px;padding:26px;text-align:center;background:#fff;margin:18px 0}
.importDrop.drag{background:#f0f0ec;border-color:#999}
.importPreview{display:grid;gap:9px;margin:18px 0}
.importRow{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);background:#fff;border-radius:18px;padding:14px}
.importRow input{margin-top:3px}
.importRow b{display:block}.importMeta{font-size:12px;color:#858581;margin-top:3px;line-height:1.45}
.importStats{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.stat{background:#ededE9;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:750}

.newChapterCTA{background:#111!important;color:#fff!important;box-shadow:0 12px 30px #00000018;border:1px solid #111!important}
.newChapterCTA:hover{background:#242424!important;transform:translateY(-1px)}
.newChapterCTA:active{transform:scale(.97)}
.segmented{display:grid;grid-template-columns:1fr 1fr;gap:7px;background:#ecece8;border-radius:18px;padding:6px;margin:15px 0}
.segmented button{border:0;background:transparent;border-radius:14px;padding:13px 12px;font-weight:800;color:#777;transition:.15s}
.segmented button.on{background:#fff;color:#111;box-shadow:0 4px 14px #0000000c}
.transportForm{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}

.sourceTag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;letter-spacing:.04em;color:#777;background:#f0f0ed;border-radius:999px;padding:6px 9px;margin-top:8px}
.cat{display:inline-flex;border:1px solid #deded8;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:800;color:#666;margin-right:5px}
.placeResult{border:1px solid var(--line);background:#fff;border-radius:20px;padding:16px;margin:10px 0}
.placeResult h3{margin:0 0 4px;font-size:20px}
.softLink{border:0;background:transparent;padding:7px 0;color:#168df2;font-weight:800}
.reminderCard{border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#fff,#f3f3ef);padding:22px;margin:14px 0}
.reminderRow{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:16px}
.toggle{width:52px;height:30px;border:0;border-radius:999px;background:#d8d8d3;padding:3px;transition:.18s}
.toggle:after{content:"";display:block;width:24px;height:24px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 2px 7px #0002}
.toggle.on{background:#111}.toggle.on:after{transform:translateX(22px)}

.collectionList{display:grid;gap:9px;max-height:48vh;overflow:auto;margin:18px 0}
.collectionRow{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;border:1px solid var(--line);background:#fff;border-radius:18px;padding:16px 18px;font:inherit}
.collectionRow:hover{background:#f6f6f3}.collectionRow:active{transform:scale(.99)}
.collectionRow b{font-size:16px}.collectionRow span{font-size:13px;color:#888}
.postContext{font-size:12px;color:#888;line-height:1.45;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
</style></head><body><div id="app"></div><div id="modal"></div>
<script>
const $=s=>document.querySelector(s), app=()=>$('#app');
const cities=[
 ['Paris','France',['파리','프랑스']],['Berlin','Germany',['베를린','독일']],['Copenhagen','Denmark',['코펜하겐','덴마크']],
 ['Tokyo','Japan',['도쿄','동경','일본']],['Rome','Italy',['로마','이탈리아']],['Barcelona','Spain',['바르셀로나','스페인']],
 ['Lisbon','Portugal',['리스본','포르투갈']],['London','United Kingdom',['런던','영국']],['Seoul','South Korea',['서울','대한민국','한국']],
 ['New York','United States',['뉴욕','미국']],['Marseille','France',['마르세유','프랑스']],['Aix-en-Provence','France',['엑상프로방스','엑상','프랑스']],
 ['Frankfurt','Germany',['프랑크푸르트','독일']],['Munich','Germany',['뮌헨','독일']],['Vienna','Austria',['빈','비엔나','오스트리아']],
 ['Prague','Czech Republic',['프라하','체코']],['Amsterdam','Netherlands',['암스테르담','네덜란드']],['Brussels','Belgium',['브뤼셀','벨기에']],
 ['Zurich','Switzerland',['취리히','스위스']],['Milan','Italy',['밀라노','이탈리아']],['Florence','Italy',['피렌체','이탈리아']],
 ['Venice','Italy',['베네치아','베니스','이탈리아']],['Madrid','Spain',['마드리드','스페인']],['Nice','France',['니스','프랑스']]
];
let state=JSON.parse(localStorage.getItem('afield10')||'null')||{lang:'ko',chapters:[{id:'paris',title:'2026년의 도망 일기',city:'Paris',country:'France',start:'2026-09-19',end:'2026-09-24',flights:[{no:'OZ501',from:'ICN',to:'CDG',arrive:'17:20'}],stays:[{name:'Hôtel Floride Etoile',dates:'9/19—9/21'},{name:'77 Rue Léon Jouhaux',dates:'9/21—9/24'}],saved:[
{name:'Trocadéro',category:'Area',address:'Place du Trocadéro et du 11 Novembre, Paris',sourceType:'user'},
{name:'Musée d’Art Moderne',category:'Culture',address:'11 Av. du Président Wilson, Paris',sourceType:'user'},
{name:'Buly',category:'Shopping',address:'Paris',sourceType:'instagram',source:'https://www.instagram.com/'},
{name:'Palais Royal',category:'Area',address:'Paris 1er',sourceType:'user'},
{name:'Folderol',category:'Food',address:'Paris 11e',sourceType:'instagram',source:'https://www.instagram.com/'}
],reminders:{stayMoveEve:true,stayMoveMorning:true},planned:true}],draft:null,current:null,step:0};
const save=()=>localStorage.setItem('afield10',JSON.stringify(state));
function iconHome(){return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 10.8 12 4.7l7.5 6.1v8.1a1.6 1.6 0 0 1-1.6 1.6H6.1a1.6 1.6 0 0 1-1.6-1.6z"/><path d="M9.2 20.5v-6.1h5.6v6.1"/></svg>`}
function iconBack(){return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="m10.5 6.5-5.5 5.5 5.5 5.5"/></svg>`}
function smartBack(){
 if(state.draft&&state.step>1){state.step--;save();onboard();return}
 if(state.draft){state.draft=null;state.step=0;save();home();return}
 if(state.current){home();return}
 home();
}
function shell(inner,opts={}){
 let back=opts.back!==false&&(!!state.draft||!!state.current);
 app().innerHTML=`<div class="wrap"><header class="top">${back?`<button class="navIcon backIcon" aria-label="뒤로" onclick="smartBack()">${iconBack()}</button>`:`<span class="navSpacer"></span>`}<div class="logo">afield</div><button class="navIcon" aria-label="홈" title="Home" onclick="home()">${iconHome()}</button></header>${inner}</div>`
}
function home(){state.current=null;save();shell(`<section class="hero"><div class="ey">AFIELD</div><h1>어디로 떠날까요?</h1><p>가고 싶은 곳을 모으면 Afield가 하나의 여행으로 이어드려요.</p><button class="btn black newChapterCTA" onclick="startNew()">+ New Chapter&nbsp;&nbsp;→</button></section><section class="chapters">${state.chapters.map(c=>`<article class="chapter" onclick="openChapter('${c.id}')"><div class="ey">${c.city} · ${c.start}—${c.end}</div><h2>${c.title}</h2><p class="small">${c.saved.length}곳 저장됨 · ${c.planned?'Planning':'Dreaming'}</p></article>`).join('')}</section>`)}
function startNew(){state.draft={id:'c'+Date.now(),title:'',city:'',country:'',start:'',end:'',flights:[],stays:[],saved:[],reminders:{stayMoveEve:true,stayMoveMorning:true},planned:false};state.step=1;save();onboard()}
function prog(n){return `<div class="progress">${[1,2,3].map(x=>`<i class="${x<=n?'on':''}"></i>`).join('')}</div>`}
function onboard(){let d=state.draft;if(state.step===1){shell(`<main class="screen">${prog(1)}<div class="ey">NEW CHAPTER · 1 OF 3</div><h1>어디로 떠날까요?</h1><p class="lead">여행의 뼈대만 먼저 만들어요. 나머지는 나중에 바꿀 수 있어요.</p><div class="field citybox"><label>CITY</label><input class="input" id="city" autocomplete="off" placeholder="Paris, Berlin, Tokyo…" oninput="cityFind(this.value)"><div id="cityResults" class="results hidden"></div></div><div class="field"><label>COUNTRY</label><input class="input" id="country" readonly placeholder="도시를 선택하면 자동 입력"></div><div class="row"><div class="field"><label>START</label><input class="input" id="start" type="date"></div><div class="field"><label>END</label><input class="input" id="end" type="date"></div></div><div class="field"><label>CHAPTER NAME</label><input class="input" id="title" placeholder="예: 2026년의 베를린 일기"></div><div class="actions"><button class="btn" onclick="home()">취소</button><button class="btn primary" onclick="step1()">계속</button></div></main>`)}
else if(state.step===2){shell(`<main class="screen">${prog(2)}<div class="ey">NEW CHAPTER · 2 OF 3</div><h1>여행 정보를 더해볼까요?</h1><p class="lead">알고 있는 것만 넣어도 충분해요. <b>나중에 언제든 추가할 수 있어요.</b></p><div class="optional"><div class="ey">GETTING THERE · OPTIONAL</div><h3>✈️ 🚆 도시 간 이동</h3><p class="small">비행기나 기차 시간을 알면 도착일·이동일·마지막 날을 현실적으로 계획할 수 있어요. 아직 정하지 않았다면 건너뛰어도 돼요.</p><div id="flights">${d.flights.map(f=>`<div class="saved"><b>${f.type==='train'?'🚆 '+(f.no||'Train'):'✈️ '+(f.no||'Flight')}</b><span>${f.from||''} → ${f.to||''}</span></div>`).join('')}</div><button class="add" onclick="addTransport()">+ 이동편 추가</button></div><div class="optional"><div class="ey">STAYS · OPTIONAL</div><h3>🛏 숙소</h3><p class="small">매일의 시작과 끝을 기준으로 이동 동선을 만들어요.</p><div id="stays">${d.stays.map(s=>`<div class="saved"><b>${s.name}</b><span>${s.dates||''}</span></div>`).join('')}</div><button class="add" onclick="addStay()">+ 숙소 추가</button></div><div class="actions"><button class="btn" onclick="state.step=1;onboard()">이전</button><button class="btn primary" onclick="state.step=3;save();onboard()">계속 · 지금은 건너뛰어도 돼요</button></div></main>`)}
else{shell(`<main class="screen">${prog(3)}<div class="ey">NEW CHAPTER · 3 OF 3</div><h1>가고 싶은 곳을 모아볼까요?</h1><p class="lead">하나씩 저장해도 되고, 이미 모아둔 장소를 가져와도 돼요.</p><div class="field"><label>PLACE SEARCH</label><input class="input" id="place" placeholder="${d.city}에서 가고 싶은 곳"></div><div class="field"><label>GOOGLE ADDRESS</label><input class="input" id="placeAddress" placeholder="Google Maps의 정확한 주소를 붙여넣거나 입력"><button class="softLink" onclick="googlePlaceSearch()">Google Maps에서 검색 ↗</button></div><button class="btn black" onclick="addPlace()">+ 이 장소 저장</button><div id="savedList" class="savedList">${renderSaved(d)}</div><section class="import"><div class="importCard"><div class="ey">BRING WHAT YOU ALREADY SAVED</div><h3>Instagram에 모아둔 것들이 있나요?</h3><p class="small">여행을 위해 모아둔 맛집, 쇼핑, 전시·공연, 숙소와 영감을 가져올 수 있어요.</p><button class="btn" onclick="instagramInfo()">Instagram에서 가져오기 →</button></div></section><div class="actions"><button class="btn" onclick="state.step=2;onboard()">이전</button><button class="btn primary" onclick="finishChapter()">${d.saved.length?`${d.saved.length}곳으로 여행 시작하기 →`:'장소는 나중에 모을게요 →'}</button></div></main>`)}}
function cityFind(q){let box=$('#cityResults');q=q.toLowerCase();let r=cities.filter(x=>(x[0]+' '+x[1]+' '+(x[2]||[]).join(' ')).toLowerCase().includes(q)).slice(0,8);box.innerHTML=r.map(x=>`<button class="result" onclick="pickCity('${x[0]}','${x[1]}')"><b>${x[0]}</b><div class="small">${x[1]}${x[2]?.length?' · '+x[2][0]:''}</div></button>`).join('');box.classList.toggle('hidden',!q)}
function pickCity(c,k){$('#city').value=c;$('#country').value=k;$('#cityResults').classList.add('hidden')}
function step1(){let d=state.draft;d.city=$('#city').value.trim();d.country=$('#country').value.trim();d.start=$('#start').value;d.end=$('#end').value;d.title=$('#title').value.trim()||`${d.city} 여행`;if(!d.city||!d.start||!d.end)return alert('도시와 여행 날짜를 먼저 알려주세요.');state.step=2;save();onboard()}
function modal(x){$('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeM()"><div class="sheet">${x}</div></div>`}function closeM(){$('#modal').innerHTML=''}
let TRANSPORT_TYPE='flight';

function readIG(file){
 if(!file)return;
 if(!/\.json$/i.test(file.name)){alert('JSON 파일을 선택해주세요.');return}
 let r=new FileReader();
 r.onload=()=>{try{
 let clean=String(r.result||'').replace(/^\uFEFF/,'').trim();
 let raw=JSON.parse(clean);
 IG_FILE_NAME=file.name;
 let exact=parseInstagramCollections(raw);
 if(exact.length){IG_COLLECTIONS=exact;renderIGCollections(file.name);return}
 IG_IMPORT=parseInstagramJSON(raw).map(x=>({...x,category:guessCategory(x)}));
 renderIGPreview(file.name);
}catch(e){
 let p=$('#igPreview');
 if(p)p.innerHTML=`<div class="notice"><b>이 파일을 읽지 못했어요.</b><p class="small">Instagram에서 내려받은 saved collections JSON을 그대로 선택해주세요.</p></div>`;
}};
 r.readAsText(file);
}
function walkJSON(v,path='',out=[]){
 if(Array.isArray(v))v.forEach((x,i)=>walkJSON(x,path+'/'+i,out));
 else if(v&&typeof v==='object'){out.push({v,path});Object.keys(v).forEach(k=>walkJSON(v[k],path+'/'+k,out))}
 return out;
}
function cleanIGText(x){return String(x||'').replace(/\s+/g,' ').trim()}

function repairIGText(v){
 if(typeof v!=='string')return v;
 try{
   let bytes=Uint8Array.from([...v].map(ch=>ch.charCodeAt(0)));
   let fixed=new TextDecoder('utf-8',{fatal:true}).decode(bytes);
   if(fixed && !fixed.includes('�'))return fixed;
 }catch(e){}
 return v;
}
function lvLabel(x){return repairIGText(x&&x.label||'')}
function lvValue(x){return repairIGText(x&&x.value||'')}
function findLV(arr,label){return (arr||[]).find(x=>lvLabel(x)===label)}
function nestedValues(node,out=[]){
 if(!node||typeof node!=='object')return out;
 if(Array.isArray(node)){node.forEach(x=>nestedValues(x,out));return out}
 if(node.label||node.value||node.href)out.push({label:lvLabel(node),value:lvValue(node),href:node.href||''});
 Object.values(node).forEach(v=>{if(v&&typeof v==='object')nestedValues(v,out)});
 return out;
}
function parseInstagramPost(node){
 let vals=nestedValues(node,[]);
 let ig=vals.find(x=>x.label==='URL' && /instagram\.com\/(reel|p)\//i.test(x.href||x.value||''));
 if(!ig)return null;
 let captions=vals.filter(x=>x.label==='캡션' && x.value).map(x=>x.value);
 let caption=captions.sort((a,b)=>b.length-a.length)[0]||'';
 let owner=vals.find(x=>x.label==='이름' && x.value && !/^https?:/i.test(x.value));
 let username=vals.find(x=>x.label==='사용자 이름' && x.value);
 let first=(caption.split(/\n+/).find(Boolean)||'').replace(/\s+/g,' ').trim();
 let title=(owner&&owner.value)||('@'+(username&&username.value||''))||first.slice(0,72)||'Instagram saved item';
 return {name:title,why:caption,source:ig.href||ig.value,owner:owner&&owner.value||'',username:username&&username.value||'',caption,category:guessCategory({name:title,why:caption})};
}
function parseInstagramCollections(raw){
 if(!Array.isArray(raw))return [];
 let cols=[];
 raw.forEach((col,ci)=>{
   if(!col||!Array.isArray(col.label_values))return;
   let nameItem=findLV(col.label_values,'이름');
   if(!nameItem||!nameItem.value)return;
   let bucket=col.label_values.find(x=>Array.isArray(x.dict)&&x.dict.length);
   if(!bucket)return;
   let posts=bucket.dict.map(parseInstagramPost).filter(Boolean);
   if(posts.length)cols.push({name:lvValue(nameItem),posts,index:ci});
 });
 return cols;
}

function parseInstagramJSON(raw){
 let nodes=walkJSON(raw), found=[];
 for(const {v,path} of nodes){
   let title=cleanIGText(v.title||v.name||v.place_name||v.location_name||v.venue_name);
   let href=cleanIGText(v.href||v.url||v.link);
   let value=cleanIGText(v.value||v.text||v.caption);
   let ts=v.timestamp||v.time||v.created_at||'';
   // Instagram exports often nest string_list_data entries under a titled object.
   if(title && Array.isArray(v.string_list_data)){
     let first=v.string_list_data[0]||{};
     href=cleanIGText(first.href||href); value=cleanIGText(first.value||value); ts=first.timestamp||ts;
     found.push({name:title,source:href,why:value,when:ts,path});
   } else if(title && (href||value||/saved|collection|place|location/i.test(path))){
     found.push({name:title,source:href,why:value,when:ts,path});
   }
 }
 // Also support lightweight user-created exports: [{name/title, url/href, why/reason}]
 if(Array.isArray(raw)) raw.forEach((v,i)=>{if(v&&typeof v==='object'){let n=cleanIGText(v.name||v.title);if(n)found.push({name:n,source:cleanIGText(v.url||v.href||v.source),why:cleanIGText(v.why||v.reason||v.note),when:v.timestamp||'',path:'/root/'+i})}});
 let seen=new Set(), current=new Set((state.draft?.saved||[]).map(x=>(typeof x==='string'?x:x.name).toLowerCase()));
 return found.filter(x=>{
   let key=x.name.toLowerCase().replace(/[^\p{L}\p{N}]+/gu,'');
   if(!key||key.length<2||seen.has(key))return false;seen.add(key);
   x.duplicate=current.has(x.name.toLowerCase());x.selected=!x.duplicate;return true;
 }).slice(0,300);
}
function guessCategory(x){
 let t=((x.name||'')+' '+(x.why||'')).toLowerCase();
 if(/hotel|airbnb|숙소|호텔|hostel/.test(t))return 'Stay';
 if(/museum|gallery|exhibition|concert|opera|theatre|theater|미술관|박물관|전시|공연|오페라|재즈/.test(t))return 'Culture';
 if(/restaurant|cafe|coffee|bakery|boulanger|patisserie|food|wine|맛집|카페|빵|식당|레스토랑/.test(t))return 'Food';
 if(/shop|store|boutique|vintage|shopping|쇼핑|빈티지|편집숍|서점/.test(t))return 'Shopping';
 if(/marais|saint.germain|canal|district|neighborhood|quartier|동네|지역|거리/.test(t))return 'Area';
 if(/look|mood|style|idea|inspo|inspiration|룩|무드|영감|코스|things to do/.test(t))return 'Inspiration';
 return 'Other';
}

function planAI(){modal(`<div class="ey">ASK AFIELD</div><h2>여행을 다시 살펴보고 있어요</h2><p id="loadtxt" class="lead">저장한 장소와 여행 날짜를 확인하고 있어요.</p><div class="reviewbar"><i style="width:42%;animation:p 2s infinite"></i></div>`);let msgs=['영업시간과 우선순위를 맞추고 있어요.','숙소와 이동 동선을 연결하고 있어요.','하루의 리듬을 만들고 있어요.'];let i=0,t=setInterval(()=>{let e=$('#loadtxt');if(e)e.textContent=msgs[i++%msgs.length]},1100);setTimeout(()=>{clearInterval(t);closeM();review()},2700)}
let ri=0,decisions=[];
const sugg=[{t:'첫날 일정을 가볍게 할까요?',why:'도착 시간이 늦어 낮 일정을 소화하기 어려워요.',before:'호텔 → 미술관 → 쇼핑 → 에펠',after:'호텔 → Trocadéro → 에펠 주변 산책'},{t:'미술관은 다음 날로 옮길까요?',why:'첫날보다 오전 시간이 있는 날이 관람에 여유로워요.',before:'9/19 Musée d’Art Moderne',after:'9/20 Musée d’Art Moderne'}];
function review(){ri=0;decisions=[];renderReview()}
function renderReview(){let s=sugg[ri];modal(`<div class="ey">AFIELD SUGGESTS · ${ri+1}/${sugg.length}</div><div class="reviewbar"><i style="width:${(ri+1)/sugg.length*100}%"></i></div><div class="suggest"><h2>${s.t}</h2><p class="small">${s.why}</p><div class="beforeafter"><div class="ba"><div class="ey">현재</div>${s.before}</div><div class="ba"><div class="ey">바꾸면</div>${s.after}</div></div></div><div class="actions"><button class="choice" onclick="choose(false)">그대로 둘게요</button><button class="choice black" onclick="choose(true)">이렇게 바꾸기</button></div>`)}
function choose(v){decisions.push(v);ri++;if(ri<sugg.length)renderReview();else modal(`<div class="ey">REVIEW CHANGES</div><h2>${decisions.filter(Boolean).length}가지를 바꿀게요.</h2><p class="lead">수용한 제안만 일정에 반영해요. 고집하고 싶은 일정은 그대로 남겨둬요.</p><div class="actions"><button class="btn" onclick="closeM()">다시 보기</button><button class="btn primary" onclick="applyPlan()">변경사항 적용</button></div>`)}
function applyPlan(){C().planned=true;save();closeM();chapter()}
function toggleReminder(el,key){let c=C();c.reminders=c.reminders||{};c.reminders[key]=!(c.reminders[key]!==false);el.classList.toggle('on',c.reminders[key]);save()}
function directions(a,b){modal(`<div class="ey">DIRECTIONS</div><h2>${a} → ${b}</h2><div class="modebar"><button class="on" onclick="mode(this,'도보')">🚶 도보</button><button onclick="mode(this,'대중교통')">🚇 대중교통</button><button onclick="mode(this,'택시')">🚕 택시</button></div><div class="map" id="rmap">Route map · 도보</div><p class="small" id="rmeta">약 10분 · 실제 시간은 Google Routes 연결 후 실시간으로 제공돼요.</p><button class="btn primary" onclick="window.open('https://www.google.com/maps','_blank')">Google Maps에서 열기 ↗</button>`)}
function mode(el,m){document.querySelectorAll('.modebar button').forEach(x=>x.classList.remove('on'));el.classList.add('on');$('#rmap').textContent='Route map · '+m;$('#rmeta').textContent=(m==='도보'?'약 10분':m==='대중교통'?'약 8분':'약 6–12분')+' · 프로토타입 예상치'}
home();
</script></body></html>
