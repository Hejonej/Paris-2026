<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f4">
<title>Afield</title>
<style>html,body{margin:0;background:#f7f7f4;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Apple SD Gothic Neo",sans-serif;color:#111}.boot{min-height:100vh;display:grid;place-items:center}.boot div{text-align:center}.boot b{font-size:28px;letter-spacing:-.04em}.boot p{color:#888;font-size:13px}</style>
</head>
<body>
<div class="boot"><div><b>afield</b><p>여행을 불러오는 중…</p></div></div>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations().catch(()=>[]);
      await Promise.all(regs.map(r=>r.unregister().catch(()=>false)));
    }
    let html=await fetch('./app-core.html?v=20260919-1718',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Afield core '+r.status);return r.text()});
    const direct=`<script src="./instagram-source-rematch.js?v=20260919-1718"><\/script><script src="./refine-v2.js?v=20260919-1718"><\/script>`;
    html=html.replace('</body>',direct+'</body>');
    document.open();document.write(html);document.close();
  }catch(e){
    document.body.innerHTML='<div class="boot"><div><b>Afield를 불러오지 못했어요.</b><p>'+String(e.message||e)+'</p><button onclick="location.reload()">다시 시도</button></div></div>';
  }
})();
</script>
</body>
</html>
