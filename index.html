<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f4"><link rel="manifest" href="./manifest.webmanifest">
<title>Afield 1.0</title>
<style>
:root{--bg:#f7f7f4;--ink:#090909;--muted:#858581;--line:#deded8;--card:#fff;--blue:#168df2}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Apple SD Gothic Neo","Noto Sans KR",sans-serif}button,input{font:inherit}button{cursor:pointer}
.wrap{max-width:1180px;margin:auto;padding:28px 28px 130px}.top{height:92px;border:1px solid #e8e8e3;border-radius:30px;background:#ffffffc9;backdrop-filter:blur(24px);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:16px;z-index:20;box-shadow:0 16px 50px #00000008}.logo{font-size:34px;font-weight:820;letter-spacing:-.055em}.pill{border:0;border-radius:999px;padding:14px 20px;background:#ededeb;font-weight:750}.black{background:#080808;color:#fff}.hero{padding:76px 4px 34px}.ey{font-size:12px;letter-spacing:.24em;font-weight:800;color:#92928e;text-transform:uppercase}.hero h1{font-size:clamp(54px,7vw,92px);line-height:.91;letter-spacing:-.065em;margin:15px 0 22px;max-width:980px}.hero p{font-size:20px;color:#74746f;line-height:1.55;max-width:720px}.chapters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.chapter{border:1px solid var(--line);background:#fff;border-radius:30px;padding:28px;min-height:250px;position:relative;overflow:hidden;transition:.2s}.chapter:hover{transform:translateY(-3px);box-shadow:0 25px 70px #0001}.chapter:active,.btn:active,.choice:active{transform:scale(.975)}.chapter h2{font-size:38px;line-height:1;letter-spacing:-.05em;margin:12px 0}.small{font-size:13px;color:#858581;line-height:1.5}.screen{max-width:820px;margin:42px auto}.progress{display:flex;gap:7px;margin:20px 0 44px}.progress i{height:5px;flex:1;background:#dfdfda;border-radius:10px}.progress i.on{background:#111}.screen h1{font-size:56px;letter-spacing:-.055em;line-height:.98;margin:10px 0 16px}.screen .lead{font-size:18px;line-height:1.55;color:#777772;margin-bottom:30px}.field{margin:18px 0}.field label{display:block;font-size:12px;font-weight:800;letter-spacing:.14em;color:#8d8d88;margin:0 0 9px}.input{width:100%;border:1px solid #dcdcd6;background:#fff;border-radius:20px;padding:18px 20px;font-size:20px;outline:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.actions{display:flex;gap:12px;margin-top:34px}.btn{border:0;border-radius:999px;padding:17px 24px;font-weight:800;transition:.12s;background:#e9e9e6}.btn.primary{background:#090909;color:#fff;flex:1}.optional{border:1px solid var(--line);border-radius:24px;background:#fff;padding:20px;margin:13px 0}.optional h3{margin:4px 0 7px;font-size:22px;letter-spacing:-.035em}.optional .add{margin-top:15px;border:1px solid #ddd;border-radius:999px;background:#fff;padding:11px 15px;font-weight:750}.citybox{position:relative}.results{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid #ddd;border-radius:18px;overflow:hidden;z-index:30;box-shadow:0 20px 55px #0002}.result{display:block;width:100%;text-align:left;border:0;background:#fff;padding:14px 18px}.result:hover{background:#f1f1ee}.hidden{display:none!important}.placeSearch{display:flex;gap:10px}.savedList{display:grid;gap:10px;margin:22px 0}.saved{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);background:#fff;border-radius:20px;padding:16px 18px}.saved b{display:block}.why{font-size:12px;color:#777;margin-top:3px}.import{margin-top:30px;border-top:1px solid var(--line);padding-top:26px}.importCard{border:1px solid var(--line);background:#fff;border-radius:24px;padding:22px}.importCard h3{font-size:22px;margin:3px 0 7px}.chapterHead{padding:56px 0 20px}.chapterHead h1{font-size:64px;letter-spacing:-.06em;line-height:.94;margin:12px 0}.tabs{display:flex;gap:8px;margin:24px 0}.tabs button{border:0;border-radius:999px;padding:12px 18px;background:#e9e9e6;font-weight:800}.tabs .on{background:#090909;color:#fff}.dates{display:flex;gap:10px;overflow:auto;padding:4px 0 14px}.date{flex:0 0 100px;border:1px solid var(--line);background:#fff;border-radius:20px;padding:14px;text-align:center}.date.on{background:#111;color:#fff}.brief,.notice{border:1px solid var(--line);border-radius:24px;background:#fff;padding:22px;margin:14px 0}.brief h2,.notice h2{font-size:27px;letter-spacing:-.04em;margin:7px 0}.routeCard{background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px;margin:10px 0}.move{border:0;background:transparent;color:#5d5d59;font-weight:750;padding:12px 6px}.map{height:300px;border-radius:24px;background:linear-gradient(135deg,#e8e8e2,#d9ddd8);display:flex;align-items:center;justify-content:center;color:#74746f;margin:18px 0}.bottom{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:40;background:#f1f1eef0;backdrop-filter:blur(24px);border:1px solid #fff;border-radius:999px;padding:7px;display:flex;box-shadow:0 15px 50px #0002}.bottom button{border:0;background:transparent;padding:13px 30px;border-radius:999px;font-weight:800;color:#777}.bottom .on{background:#090909;color:#fff}.modal{position:fixed;inset:0;background:#0006;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}.sheet{width:min(720px,100%);max-height:88vh;overflow:auto;background:#fbfbf9;border-radius:34px;padding:30px}.modebar{display:flex;gap:8px}.modebar button{border:0;border-radius:999px;padding:11px 15px}.modebar .on{background:#111;color:#fff}.suggest{border:1px solid var(--line);border-radius:24px;padding:20px;background:#fff}.beforeafter{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.ba{background:#f0f0ed;border-radius:18px;padding:14px}.choice{border:0;border-radius:999px;padding:14px 18px;font-weight:800}.reviewbar{height:5px;background:#e1e1dc;border-radius:10px;overflow:hidden;margin:14px 0 25px}.reviewbar i{display:block;height:100%;background:#111}
@media(max-width:760px){.wrap{padding:18px 18px 120px}.top{height:76px;border-radius:25px;padding:0 20px}.logo{font-size:30px}.hero{padding:60px 4px 28px}.hero h1{font-size:56px}.hero p{font-size:17px}.chapters{grid-template-columns:1fr}.screen{margin:30px 0}.screen h1{font-size:44px}.row{grid-template-columns:1fr}.chapterHead{padding-top:42px}.chapterHead h1{font-size:50px}.bottom{left:16px;right:16px;transform:none;justify-content:space-between;bottom:calc(12px + env(safe-area-inset-bottom))}.bottom button{padding:12px 20px}.modal{align-items:flex-end;padding:8px}.sheet{border-radius:30px 30px 18px 18px;max-height:84vh}.beforeafter{grid-template-columns:1fr}.map{height:240px}}

.importDrop{border:1.5px dashed #cfcfc8;border-radius:24px;padding:26px;text-align:center;background:#fff;margin:18px 0}
.importDrop.drag{background:#f0f0ec;border-color:#999}
.importPreview{display:grid;gap:9px;margin:18px 0}
.importRow{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);background:#fff;border-radius:18px;padding:14px}
.importRow input{margin-top:3px}
.importRow b{display:block}.importMeta{font-size:12px;color:#858581;margin-top:3px;line-height:1.45}
.importStats{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.stat{background:#ededE9;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:750}
</style></head><body><div id="app"></div><div id="modal"></div>
<script>
const $=s=>document.querySelector(s), app=()=>$('#app');
const cities=[['Paris','France'],['Berlin','Germany'],['Copenhagen','Denmark'],['Tokyo','Japan'],['Rome','Italy'],['Barcelona','Spain'],['Lisbon','Portugal'],['London','United Kingdom'],['Seoul','South Korea'],['New York','United States']];
let state=JSON.parse(localStorage.getItem('afield10')||'null')||{lang:'ko',chapters:[{id:'paris',title:'2026년의 도망 일기',city:'Paris',country:'France',start:'2026-09-19',end:'2026-09-24',flights:[{no:'OZ501',from:'ICN',to:'CDG',arrive:'17:20'}],stays:[{name:'Hôtel Floride Etoile',dates:'9/19—9/21'},{name:'77 Rue Léon Jouhaux',dates:'9/21—9/24'}],saved:['Trocadéro','Musée d’Art Moderne','Buly','Palais Royal','Folderol'],planned:true}],draft:null,current:null,step:0};
const save=()=>localStorage.setItem('afield10',JSON.stringify(state));
function shell(inner){app().innerHTML=`<div class="wrap"><header class="top"><div class="logo">afield</div><button class="pill" onclick="home()">⌂</button></header>${inner}</div>`}
function home(){state.current=null;save();shell(`<section class="hero"><div class="ey">AFIELD</div><h1>어디로 떠날까요?</h1><p>가고 싶은 곳을 모으면 Afield가 하나의 여행으로 이어드려요.</p><button class="btn black" onclick="startNew()">+ New Chapter</button></section><section class="chapters">${state.chapters.map(c=>`<article class="chapter" onclick="openChapter('${c.id}')"><div class="ey">${c.city} · ${c.start}—${c.end}</div><h2>${c.title}</h2><p class="small">${c.saved.length}곳 저장됨 · ${c.planned?'Planning':'Dreaming'}</p></article>`).join('')}</section>`)}
function startNew(){state.draft={id:'c'+Date.now(),title:'',city:'',country:'',start:'',end:'',flights:[],stays:[],saved:[],planned:false};state.step=1;save();onboard()}
function prog(n){return `<div class="progress">${[1,2,3].map(x=>`<i class="${x<=n?'on':''}"></i>`).join('')}</div>`}
function onboard(){let d=state.draft;if(state.step===1){shell(`<main class="screen">${prog(1)}<div class="ey">NEW CHAPTER · 1 OF 3</div><h1>어디로 떠날까요?</h1><p class="lead">여행의 뼈대만 먼저 만들어요. 나머지는 나중에 바꿀 수 있어요.</p><div class="field citybox"><label>CITY</label><input class="input" id="city" autocomplete="off" placeholder="Paris, Berlin, Tokyo…" oninput="cityFind(this.value)"><div id="cityResults" class="results hidden"></div></div><div class="field"><label>COUNTRY</label><input class="input" id="country" readonly placeholder="도시를 선택하면 자동 입력"></div><div class="row"><div class="field"><label>START</label><input class="input" id="start" type="date"></div><div class="field"><label>END</label><input class="input" id="end" type="date"></div></div><div class="field"><label>CHAPTER NAME</label><input class="input" id="title" placeholder="예: 2026년의 베를린 일기"></div><div class="actions"><button class="btn" onclick="home()">취소</button><button class="btn primary" onclick="step1()">계속</button></div></main>`)}
else if(state.step===2){shell(`<main class="screen">${prog(2)}<div class="ey">NEW CHAPTER · 2 OF 3</div><h1>여행 정보를 더해볼까요?</h1><p class="lead">알고 있는 것만 넣어도 충분해요. <b>나중에 언제든 추가할 수 있어요.</b></p><div class="optional"><div class="ey">FLIGHTS · OPTIONAL</div><h3>✈️ 항공편</h3><p class="small">도착·출발 시간을 알면 첫날과 마지막 날을 현실적으로 계획할 수 있어요.</p><div id="flights">${d.flights.map(f=>`<div class="saved"><b>${f.no}</b><span>${f.from} → ${f.to}</span></div>`).join('')}</div><button class="add" onclick="addFlight()">+ 항공편 추가</button></div><div class="optional"><div class="ey">STAYS · OPTIONAL</div><h3>🛏 숙소</h3><p class="small">매일의 시작과 끝을 기준으로 이동 동선을 만들어요.</p><div id="stays">${d.stays.map(s=>`<div class="saved"><b>${s.name}</b><span>${s.dates||''}</span></div>`).join('')}</div><button class="add" onclick="addStay()">+ 숙소 추가</button></div><div class="actions"><button class="btn" onclick="state.step=1;onboard()">이전</button><button class="btn primary" onclick="state.step=3;save();onboard()">계속 · 지금은 건너뛰어도 돼요</button></div></main>`)}
else{shell(`<main class="screen">${prog(3)}<div class="ey">NEW CHAPTER · 3 OF 3</div><h1>가고 싶은 곳을 모아볼까요?</h1><p class="lead">하나씩 저장해도 되고, 이미 모아둔 장소를 가져와도 돼요.</p><div class="field"><label>PLACE SEARCH</label><div class="placeSearch"><input class="input" id="place" placeholder="${d.city}에서 가고 싶은 곳"><button class="btn black" onclick="addPlace()">저장</button></div></div><div id="savedList" class="savedList">${renderSaved(d)}</div><section class="import"><div class="importCard"><div class="ey">BRING WHAT YOU ALREADY SAVED</div><h3>Instagram에 저장해둔 곳이 있나요?</h3><p class="small">저장한 게시물이나 컬렉션에서 장소를 가져올 수 있어요. 연결은 선택이에요.</p><button class="btn" onclick="instagramInfo()">Instagram에서 가져오기 →</button></div></section><div class="actions"><button class="btn" onclick="state.step=2;onboard()">이전</button><button class="btn primary" onclick="finishChapter()">${d.saved.length?`${d.saved.length}곳으로 여행 시작하기 →`:'장소는 나중에 모을게요 →'}</button></div></main>`)}}
function cityFind(q){let box=$('#cityResults');q=q.toLowerCase();let r=cities.filter(x=>(x[0]+' '+x[1]).toLowerCase().includes(q)).slice(0,6);box.innerHTML=r.map(x=>`<button class="result" onclick="pickCity('${x[0]}','${x[1]}')"><b>${x[0]}</b><div class="small">${x[1]}</div></button>`).join('');box.classList.toggle('hidden',!q)}
function pickCity(c,k){$('#city').value=c;$('#country').value=k;$('#cityResults').classList.add('hidden')}
function step1(){let d=state.draft;d.city=$('#city').value.trim();d.country=$('#country').value.trim();d.start=$('#start').value;d.end=$('#end').value;d.title=$('#title').value.trim()||`${d.city} 여행`;if(!d.city||!d.start||!d.end)return alert('도시와 여행 날짜를 먼저 알려주세요.');state.step=2;save();onboard()}
function modal(x){$('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeM()"><div class="sheet">${x}</div></div>`}function closeM(){$('#modal').innerHTML=''}
function addFlight(){modal(`<div class="ey">ADD FLIGHT</div><h2>항공편 추가</h2><div class="field"><label>FLIGHT NUMBER</label><input id="fno" class="input" placeholder="OZ501"></div><div class="row"><input id="ff" class="input" placeholder="ICN"><input id="ft" class="input" placeholder="CDG"></div><div class="actions"><button class="btn" onclick="closeM()">취소</button><button class="btn primary" onclick="saveFlight()">추가</button></div>`)}
function saveFlight(){state.draft.flights.push({no:$('#fno').value||'Flight',from:$('#ff').value,to:$('#ft').value});save();closeM();onboard()}
function addStay(){modal(`<div class="ey">ADD STAY</div><h2>숙소 추가</h2><div class="field"><label>HOTEL / ADDRESS</label><input id="sn" class="input" placeholder="호텔명 또는 주소"></div><div class="actions"><button class="btn" onclick="closeM()">취소</button><button class="btn primary" onclick="saveStay()">추가</button></div>`)}
function saveStay(){state.draft.stays.push({name:$('#sn').value||'Stay'});save();closeM();onboard()}
function addPlace(){let v=$('#place').value.trim();if(!v)return;state.draft.saved.push({name:v,why:''});save();onboard();setTimeout(()=>{let e=document.querySelector(`[data-why="${state.draft.saved.length-1}"]`);if(e)e.focus()},30)}
function renderSaved(d){return d.saved.map((p,i)=>typeof p==='string'?`<div class="saved"><b>${p}</b></div>`:`<div class="saved"><div><b>${p.name}</b><input data-why="${i}" value="${p.why||''}" onchange="state.draft.saved[${i}].why=this.value;save()" style="border:0;background:transparent;outline:0;padding:4px 0;width:100%" placeholder="왜 저장했나요? (선택)"></div><button class="pill" onclick="state.draft.saved.splice(${i},1);save();onboard()">×</button></div>`).join('')}
let IG_IMPORT=[];
function instagramInfo(){modal(`<div class="ey">IMPORT FROM INSTAGRAM</div><h2>저장해둔 장소를 가져올까요?</h2><p class="lead">Instagram에서 내보낸 JSON 파일을 올리면 Afield가 장소로 보이는 항목을 찾아 먼저 보여드려요. 확인한 것만 이 Chapter에 저장돼요.</p><div id="igDrop" class="importDrop" onclick="$('#igFile').click()"><b>JSON 파일 선택</b><div class="small" style="margin-top:6px">또는 이곳에 파일을 놓으세요</div><input id="igFile" class="hidden" type="file" accept=".json,application/json" onchange="readIG(this.files[0])"></div><div id="igPreview"></div><div class="actions"><button class="btn" onclick="closeM()">나중에 할게요</button></div>`);
 let d=$('#igDrop');['dragenter','dragover'].forEach(e=>d.addEventListener(e,x=>{x.preventDefault();d.classList.add('drag')}));['dragleave','drop'].forEach(e=>d.addEventListener(e,x=>{x.preventDefault();d.classList.remove('drag')}));d.addEventListener('drop',e=>readIG(e.dataTransfer.files[0]));
}
function readIG(file){
 if(!file)return;
 if(!/\.json$/i.test(file.name)){alert('JSON 파일을 선택해주세요.');return}
 let r=new FileReader();
 r.onload=()=>{try{let raw=JSON.parse(r.result);IG_IMPORT=parseInstagramJSON(raw);renderIGPreview(file.name)}catch(e){alert('JSON을 읽지 못했어요. 다른 Instagram export JSON을 선택해주세요.')}};
 r.readAsText(file);
}
function walkJSON(v,path='',out=[]){
 if(Array.isArray(v))v.forEach((x,i)=>walkJSON(x,path+'/'+i,out));
 else if(v&&typeof v==='object'){out.push({v,path});Object.keys(v).forEach(k=>walkJSON(v[k],path+'/'+k,out))}
 return out;
}
function cleanIGText(x){return String(x||'').replace(/\s+/g,' ').trim()}
function parseInstagramJSON(raw){
 let nodes=walkJSON(raw), found=[];
 for(const {v,path} of nodes){
   let title=cleanIGText(v.title||v.name||v.place_name||v.location_name||v.venue_name);
   let href=cleanIGText(v.href||v.url||v.link);
   let value=cleanIGText(v.value||v.text||v.caption);
   let ts=v.timestamp||v.time||v.created_at||'';
   // Instagram exports often nest string_list_data entries under a titled object.
   if(title && Array.isArray(v.string_list_data)){
     let first=v.string_list_data[0]||{};
     href=cleanIGText(first.href||href); value=cleanIGText(first.value||value); ts=first.timestamp||ts;
     found.push({name:title,source:href,why:value,when:ts,path});
   } else if(title && (href||value||/saved|collection|place|location/i.test(path))){
     found.push({name:title,source:href,why:value,when:ts,path});
   }
 }
 // Also support lightweight user-created exports: [{name/title, url/href, why/reason}]
 if(Array.isArray(raw)) raw.forEach((v,i)=>{if(v&&typeof v==='object'){let n=cleanIGText(v.name||v.title);if(n)found.push({name:n,source:cleanIGText(v.url||v.href||v.source),why:cleanIGText(v.why||v.reason||v.note),when:v.timestamp||'',path:'/root/'+i})}});
 let seen=new Set(), current=new Set((state.draft?.saved||[]).map(x=>(typeof x==='string'?x:x.name).toLowerCase()));
 return found.filter(x=>{
   let key=x.name.toLowerCase().replace(/[^\p{L}\p{N}]+/gu,'');
   if(!key||key.length<2||seen.has(key))return false;seen.add(key);
   x.duplicate=current.has(x.name.toLowerCase());x.selected=!x.duplicate;return true;
 }).slice(0,300);
}
function renderIGPreview(filename){
 let p=$('#igPreview'); if(!IG_IMPORT.length){p.innerHTML=`<div class="notice"><b>가져올 장소를 찾지 못했어요.</b><div class="small">Instagram export 형식에 따라 저장 항목 구조가 다를 수 있어요. 다른 saved/collection JSON을 선택해보세요.</div></div>`;return}
 let fresh=IG_IMPORT.filter(x=>!x.duplicate).length, dup=IG_IMPORT.length-fresh;
 p.innerHTML=`<div class="importStats"><span class="stat">${IG_IMPORT.length}개 찾음</span><span class="stat">${fresh}개 새 장소</span>${dup?`<span class="stat">${dup}개 이미 저장됨</span>`:''}</div><div class="small">${filename} · 가져오기 전에 선택을 확인할 수 있어요.</div><div class="importPreview">${IG_IMPORT.map((x,i)=>`<label class="importRow"><input type="checkbox" ${x.selected?'checked':''} ${x.duplicate?'disabled':''} onchange="IG_IMPORT[${i}].selected=this.checked"><div><b>${escIG(x.name)}</b><div class="importMeta">${x.duplicate?'이미 이 Chapter에 저장되어 있어요.':x.why?escIG(x.why).slice(0,150):'Instagram saved item'}${x.source?` · 원본 링크 있음`:''}</div></div></label>`).join('')}</div><div class="actions"><button class="btn" onclick="instagramInfo()">다른 파일</button><button class="btn primary" onclick="applyIGImport()">선택한 장소 가져오기</button></div>`;
}
function escIG(x){return String(x||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function applyIGImport(){
 let d=state.draft, add=IG_IMPORT.filter(x=>x.selected&&!x.duplicate);
 add.forEach(x=>d.saved.push({name:x.name,why:x.why||'',source:x.source||'',importedFrom:'Instagram'}));
 save();closeM();onboard();
}
function finishChapter(){let d=state.draft;state.chapters.push(d);state.current=d.id;state.draft=null;save();openChapter(d.id)}
function C(){return state.chapters.find(c=>c.id===state.current)}
function openChapter(id){state.current=id;save();chapter()}
function chapter(){let c=C(),saved=c.saved||[];shell(`<section class="chapterHead"><div class="ey">${c.city} · ${c.start}—${c.end}</div><h1>${c.title}</h1><p class="small">장소 이름뿐 아니라, 왜 저장했는지까지 함께 보며 하루를 만들어요.</p><div class="tabs"><button class="on">Trip</button><button onclick="places()">Places</button><button onclick="mapView()">Map</button></div><div class="dates">${['9/19','9/20','9/21','9/22','9/23'].map((d,i)=>`<button class="date ${i===0?'on':''}">${['토','일','월','화','수'][i]}<br><span class="small">${d}</span></button>`).join('')}</div></section>${c.planned?plannedHTML(c):emptyPlan(c)}<nav class="bottom"><button class="on">여행</button><button onclick="places()">장소</button><button onclick="mapView()">지도</button></nav>`)}
function emptyPlan(c){return `<div class="brief"><div class="ey">DREAMING → PLANNING</div><h2>${c.saved.length?`${c.saved.length}곳이 모였어요. 이제 하루로 이어볼까요?`:'먼저 가고 싶은 곳을 모아볼까요?'}</h2><p class="small">날짜, 숙소, 이동 동선과 저장한 이유를 함께 볼게요.</p><div class="actions"><button class="btn" onclick="places()">+ 장소 더 저장</button>${c.saved.length?`<button class="btn primary" onclick="planAI()">✦ Plan with Afield</button>`:''}</div></div>`}
function plannedHTML(c){return `<div class="notice"><div class="ey">AFIELD NOTICED SOMETHING</div><h2>첫날 일정이 조금 빡빡해 보여요.</h2><p class="small">OZ501이 CDG에 17:20 도착해요. 첫날은 서쪽 파리에서 가볍게 시작하는 편이 자연스러워요.</p><button class="move" onclick="review()">Review changes →</button></div><div class="brief"><div class="ey">오늘의 동네</div><h2>Trocadéro에서 파리의 첫 장면을 시작해요.</h2><p class="small">숙소에 짐을 두고 에펠탑이 가장 잘 보이는 트로카데로 주변을 천천히 걸어요.</p></div>${['Hôtel Floride Etoile','Trocadéro','Eiffel Tower 주변 산책'].map((x,i)=>`<div class="routeCard"><div class="ey">${i+1<10?'0':''}${i+1} · PLACE</div><h2>${x}</h2><p class="small">${i===0?'첫 번째 숙소 · 체크인':i===1?'에펠탑 전망 · 산책 · 16구':'첫날 저녁 · 산책'}</p></div>${i<2?`<button class="move" onclick="directions('${x}','${['Trocadéro','Eiffel Tower'][i]}')">🚶 약 ${8+i*4}분 ›</button>`:''}`).join('')}<div class="ey" style="margin-top:30px">오늘의 전체 경로</div><div class="map">Map · Hôtel Floride Etoile → Trocadéro → Eiffel Tower</div>`}
function places(){let c=C();shell(`<main class="screen"><div class="ey">${c.title}</div><h1>Places</h1><p class="lead">계획에 들어간 곳과 아직 일정이 없는 곳을 함께 관리해요.</p><div class="field"><div class="placeSearch"><input class="input" id="cp" placeholder="새 장소 저장"><button class="btn black" onclick="chapterAddPlace()">저장</button></div></div><div class="savedList">${(c.saved||[]).map(p=>`<div class="saved"><div><b>${typeof p==='string'?p:p.name}</b><div class="why">${typeof p==='string'?'':p.why||'Saved in this chapter'}</div></div><span>♡</span></div>`).join('')}</div><button class="btn" onclick="chapter()">← Trip</button></main>`)}
function chapterAddPlace(){let v=$('#cp').value.trim();if(v){C().saved.push({name:v,why:''});save();places()}}
function mapView(){let c=C();shell(`<main class="screen"><div class="ey">${c.title}</div><h1>Map</h1><div class="map">전체 여행 장소 지도</div><button class="btn" onclick="chapter()">← Trip</button></main>`)}
function planAI(){modal(`<div class="ey">ASK AFIELD</div><h2>여행을 다시 살펴보고 있어요</h2><p id="loadtxt" class="lead">저장한 장소와 여행 날짜를 확인하고 있어요.</p><div class="reviewbar"><i style="width:42%;animation:p 2s infinite"></i></div>`);let msgs=['영업시간과 우선순위를 맞추고 있어요.','숙소와 이동 동선을 연결하고 있어요.','하루의 리듬을 만들고 있어요.'];let i=0,t=setInterval(()=>{let e=$('#loadtxt');if(e)e.textContent=msgs[i++%msgs.length]},1100);setTimeout(()=>{clearInterval(t);closeM();review()},2700)}
let ri=0,decisions=[];
const sugg=[{t:'첫날 일정을 가볍게 할까요?',why:'도착 시간이 늦어 낮 일정을 소화하기 어려워요.',before:'호텔 → 미술관 → 쇼핑 → 에펠',after:'호텔 → Trocadéro → 에펠 주변 산책'},{t:'미술관은 다음 날로 옮길까요?',why:'첫날보다 오전 시간이 있는 날이 관람에 여유로워요.',before:'9/19 Musée d’Art Moderne',after:'9/20 Musée d’Art Moderne'}];
function review(){ri=0;decisions=[];renderReview()}
function renderReview(){let s=sugg[ri];modal(`<div class="ey">AFIELD SUGGESTS · ${ri+1}/${sugg.length}</div><div class="reviewbar"><i style="width:${(ri+1)/sugg.length*100}%"></i></div><div class="suggest"><h2>${s.t}</h2><p class="small">${s.why}</p><div class="beforeafter"><div class="ba"><div class="ey">현재</div>${s.before}</div><div class="ba"><div class="ey">바꾸면</div>${s.after}</div></div></div><div class="actions"><button class="choice" onclick="choose(false)">그대로 둘게요</button><button class="choice black" onclick="choose(true)">이렇게 바꾸기</button></div>`)}
function choose(v){decisions.push(v);ri++;if(ri<sugg.length)renderReview();else modal(`<div class="ey">REVIEW CHANGES</div><h2>${decisions.filter(Boolean).length}가지를 바꿀게요.</h2><p class="lead">수용한 제안만 일정에 반영해요. 고집하고 싶은 일정은 그대로 남겨둬요.</p><div class="actions"><button class="btn" onclick="closeM()">다시 보기</button><button class="btn primary" onclick="applyPlan()">변경사항 적용</button></div>`)}
function applyPlan(){C().planned=true;save();closeM();chapter()}
function directions(a,b){modal(`<div class="ey">DIRECTIONS</div><h2>${a} → ${b}</h2><div class="modebar"><button class="on" onclick="mode(this,'도보')">🚶 도보</button><button onclick="mode(this,'대중교통')">🚇 대중교통</button><button onclick="mode(this,'택시')">🚕 택시</button></div><div class="map" id="rmap">Route map · 도보</div><p class="small" id="rmeta">약 10분 · 실제 시간은 Google Routes 연결 후 실시간으로 제공돼요.</p><button class="btn primary" onclick="window.open('https://www.google.com/maps','_blank')">Google Maps에서 열기 ↗</button>`)}
function mode(el,m){document.querySelectorAll('.modebar button').forEach(x=>x.classList.remove('on'));el.classList.add('on');$('#rmap').textContent='Route map · '+m;$('#rmeta').textContent=(m==='도보'?'약 10분':m==='대중교통'?'약 8분':'약 6–12분')+' · 프로토타입 예상치'}
home();
</script></body></html>
