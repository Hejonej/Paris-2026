<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Afield · 추천 UX 테스트</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#171918;background:#f7f7f5}*{box-sizing:border-box}body{margin:0}.wrap{max-width:520px;margin:auto;padding:27px 20px 90px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:33px;letter-spacing:-1.4px;margin:30px 0 7px}h2{font-size:20px;margin:4px 0 12px}p{line-height:1.6;color:#70736f;font-size:14px}small{color:#858783}.logo{font-size:25px;font-weight:800;letter-spacing:-1px}.pill{background:#e9eae5;border-radius:30px;padding:9px 11px;font-size:12px}.tabs{display:flex;gap:6px;margin:23px 0 17px}.tabs button{flex:1}.card{background:white;border:1px solid #e2e2dc;padding:18px;border-radius:17px;margin:11px 0}.card h2{margin:0 0 5px}.meta{font-size:12px;color:#777}.actions{display:flex;gap:7px;margin-top:16px}.actions button{flex:1}button{border:0;background:#e9eae7;color:#202321;border-radius:10px;padding:12px 10px;font-size:13px;font-weight:650;min-height:44px}button.primary{background:#222623;color:white}button:disabled{opacity:.43}.notice{background:#eff0ea;padding:14px;border-radius:14px;font-size:13px;line-height:1.55}.label{font-weight:700;font-size:13px;margin-top:20px}select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;background:white;margin:8px 0}.status{margin-top:14px;min-height:35px;font-size:13px;color:#385648}.day{border-bottom:1px solid #deded9;padding:12px 0;font-size:14px}.day b{display:block;margin-bottom:6px}.tiny{font-size:12px;color:#858783}.hidden{display:none}</style></head><body><main class="wrap"><header><span class="logo">afield</span><span class="pill">별도 테스트 · 운영 미반영</span></header><h1>파리에서의 발견</h1><p>추천을 여행 후보로 모아두거나, 날짜를 골라 일정에 추가할 수 있어요.</p><nav class="tabs"><button id="exploreBtn">장소 탐색</button><button id="slotBtn">빈 시간 추천</button><button id="tripBtn">내 여행 보기</button></nav><div id="notice" class="notice">이 화면은 테스트용 가상 장소 데이터입니다. 실제 영업시간과 동선은 검증되지 않았습니다. 일정 추가는 데모에서만 가상 검증을 적용합니다.</div><div id="items"></div><div id="review" class="hidden card"></div><div id="status" class="status" aria-live="polite"></div><button id="undo" disabled>마지막 변경 되돌리기</button></main><script src="../recommendation-actions-v1.js"></script><script>
(()=>{'use strict'; const A=window.AfieldRecommendationActionsV1;const $=id=>document.getElementById(id);let context='explore',trip={city:'Paris',recommendationCandidates:[],plan:{days:Array.from({length:5},()=>({items:[],nearby:[],backup:[]}))}},undo=null,pending=null;const places=[{placeId:'demo-ofr',name:'Ofr. Paris',address:'Paris',why:'아트북과 독립출판물 탐색',type:'취향 기반'},{placeId:'demo-carnavalet',name:'Musée Carnavalet',address:'Paris',why:'파리의 역사와 새로운 발견',type:'새로운 발견'},{placeId:'demo-merci',name:'Merci',address:'Paris',why:'디자인과 라이프스타일 편집숍',type:'취향 기반'}];const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));const say=s=>$('status').textContent=s;const setContext=x=>{context=x;pending=null;draw()};$('exploreBtn').onclick=()=>setContext('explore');$('slotBtn').onclick=()=>setContext('fill_slot');$('tripBtn').onclick=()=>setContext('trip');$('undo').onclick=()=>{if(!undo)return;trip=undo;undo=null;say('마지막 변경을 되돌렸어요.');draw(false)};function draft(type,p){pending={type,place:p,dayIndex:1,layer:'items'};draw();}function apply(){if(!pending)return;try{const approved={...pending,verified:pending.type==='SCHEDULE'};const r=A.applyApproved(trip,approved);trip=r.next;undo=r.undo;pending=null;say('테스트 데이터에 반영했어요. 실제 앱 데이터는 변경되지 않았어요.');draw(false)}catch(e){say('적용 불가: '+e.message)}}function draw(clear=true){$('undo').disabled=!undo;if(clear)say('');$('exploreBtn').className=context==='explore'?'primary':'';$('slotBtn').className=context==='fill_slot'?'primary':'';$('tripBtn').className=context==='trip'?'primary':'';if(context==='trip'){$('items').innerHTML='<h2>여행 후보 ('+trip.recommendationCandidates.length+')</h2>'+trip.recommendationCandidates.map(p=>'<div class="day">'+esc(p.name)+' <span class="tiny">아직 일정 미배치</span></div>').join('')+'<h2>날짜별 일정</h2>'+trip.plan.days.map((d,i)=>'<div class="day"><b>11월 '+(12+i)+'일</b>'+((d.items||[]).map(p=>esc(p.name)).join(', ')||'아직 일정이 없어요')+'</div>').join('');}else{const labels=A.cta(context);$('items').innerHTML=places.map((p,i)=>'<article class="card"><div class="meta">'+esc(p.type)+'</div><h2>'+esc(p.name)+'</h2><p>'+esc(p.why)+'</p><div class="actions"><button class="primary" data-i="'+i+'" data-kind="primary">'+esc(labels.primary)+'</button><button data-i="'+i+'" data-kind="secondary">'+esc(labels.secondary)+'</button></div></article>').join('');$('items').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const p=places[Number(b.dataset.i)],label=labels[b.dataset.kind];draft(label.includes('후보')?'ADD_CANDIDATE':'SCHEDULE',p)})}const rev=$('review');rev.classList.toggle('hidden',!pending);if(pending){rev.innerHTML='<h2>변경 전 확인</h2><p>'+esc(pending.place.name)+' → '+(pending.type==='ADD_CANDIDATE'?'여행 후보에 추가 (일정에 배치하지 않음)':'11월 13일 일정에 추가 (데모상 검증 가정)')+'</p>'+(pending.type==='SCHEDULE'?'<label class="tiny">일정 날짜 선택</label><select id="daySelect">'+trip.plan.days.map((_,i)=>'<option value="'+i+'" '+(pending.dayIndex===i?'selected':'')+'>11월 '+(12+i)+'일</option>').join('')+'</select>':'')+'<div class="actions"><button id="cancel">취소</button><button id="approve" class="primary">변경 승인</button></div>';$('cancel').onclick=()=>{pending=null;draw()};if($('daySelect'))$('daySelect').onchange=e=>pending.dayIndex=Number(e.target.value);$('approve').onclick=apply}}draw()})();
</script></body></html>
