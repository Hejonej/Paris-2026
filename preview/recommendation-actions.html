<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Afield · 추천 흐름 테스트</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#f6f6f3;color:#171918}*{box-sizing:border-box}body{margin:0}main{max-width:540px;margin:auto;padding:22px 18px 100px}header{display:flex;justify-content:space-between;align-items:center}.logo{font-size:24px;font-weight:850;letter-spacing:-1px}.eyebrow{font-size:11px;letter-spacing:.12em;color:#7c7d78;font-weight:700}.headline{font-size:31px;letter-spacing:-1.3px;line-height:1.16;margin:26px 0 9px}p{color:#777973;line-height:1.55;font-size:14px}.sub{margin:5px 0 22px}.tag{background:#ecece7;border-radius:99px;padding:8px 10px;font-size:11px}.topnav{display:flex;gap:6px;margin:20px 0 22px}.topnav button{flex:1;font-size:13px}.button,button{border:0;border-radius:11px;padding:12px 11px;min-height:44px;font-weight:700;font-size:13px;background:#e9e9e5;color:#171918}.primary{background:#202522;color:white}.outline{background:white;border:1px solid #deded8}.card{border:1px solid #e4e4de;border-radius:17px;padding:18px;background:white;margin:11px 0}.card h3{font-size:20px;margin:4px 0 6px;letter-spacing:-.45px}.card p{margin:7px 0 0}.buttons{display:flex;gap:8px;margin-top:15px}.buttons>*{flex:1}.mini{font-size:12px;color:#73766f}.callout{background:#edeee8;border-radius:13px;padding:13px 15px;font-size:13px;line-height:1.55;color:#51574f}.result{background:#eaf0ea;border:1px solid #cbdccc;border-radius:16px;padding:18px;margin:18px 0}.result h3{margin:4px 0;font-size:19px}.result p{margin:7px 0 12px;color:#475748}.result button{background:white}.slot{border-bottom:1px solid #e3e3dd;padding:15px 0}.slot h3{font-size:15px;margin:0 0 8px}.slot .mini{margin-top:5px}select{width:100%;margin:10px 0;padding:13px;border:1px solid #dadbd4;background:white;border-radius:11px;font-size:15px}.overlay{position:fixed;inset:0;background:#0007;display:flex;justify-content:center;align-items:flex-end;z-index:5;padding:10px}.sheet{background:#fff;width:min(550px,100%);padding:23px;border-radius:21px 21px 13px 13px;max-height:85vh;overflow:auto}.sheet h2{font-size:23px;margin:6px 0}.sheet .buttons{margin-top:22px}.sheet p{margin:8px 0}.hidden{display:none!important}.footer{margin-top:30px}.muted{color:#777}button:disabled{opacity:.4}
</style></head><body><main>
<header><span class="logo">afield</span><span class="tag">TEST PREVIEW</span></header>
<nav class="topnav"><button id="explore">장소 탐색</button><button id="slot">빈 시간 추천</button><button id="trip">이번 여행 <span id="count"></span></button></nav>
<div id="confirmation" aria-live="polite"></div>
<section id="content"></section>
<div class="footer"><p class="mini">이 화면은 개발용 시뮬레이션이야. 추천·일정 정보는 가상 데이터이며 실제 운영시간·동선 검증과 계정 저장은 연결되지 않았어.</p><button id="reset" class="outline">테스트 처음부터 다시 하기</button></div>
</main>
<div id="modal" class="overlay hidden" role="dialog" aria-modal="true" aria-label="변경 내용 확인"><section class="sheet" id="modalbody"></section></div>
<script src="../recommendation-actions-v1.js"></script><script>
(function(){
'use strict';
const A=window.AfieldRecommendationActionsV1,$=id=>document.getElementById(id);
const escape=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\"':'&quot;',"'":'&#39;'}[x]));
const places=[{placeId:'demo-ofr',name:'Ofr. Paris',address:'Paris',kind:'취향 기반',desc:'아트북과 독립출판물 탐색'},{placeId:'demo-carnavalet',name:'Musée Carnavalet',address:'Paris',kind:'새로운 발견',desc:'파리의 역사와 문화 탐색'},{placeId:'demo-merci',name:'Merci',address:'Paris',kind:'취향 기반',desc:'디자인과 라이프스타일 편집숍'}];
const fresh=()=>({city:'Paris',recommendationCandidates:[],plan:{days:Array.from({length:5},()=>({items:[],nearby:[],backup:[]}))}});
let trip=fresh(),view='explore',pending=null,undo=null,notice=null,focus=null;
function counts(){return {c:trip.recommendationCandidates.length,s:trip.plan.days.reduce((n,d)=>n+d.items.length,0)}}
function setView(v){view=v;notice=null;pending=null;close();render()}
$('explore').onclick=()=>setView('explore');$('slot').onclick=()=>setView('slot');$('trip').onclick=()=>setView('trip');
$('reset').onclick=()=>{trip=fresh();undo=null;notice=null;focus=null;setView('explore')};
function close(){pending=null;$('modal').classList.add('hidden');$('modalbody').innerHTML=''}
$('modal').onclick=e=>{if(e.target===$('modal'))close()};
function preview(type,place){pending={type,place,dayIndex:1,layer:'items'};const scheduled=type==='SCHEDULE';$('modalbody').innerHTML='<div class="eyebrow">CONFIRM</div><h2>'+ (scheduled?'일정에 추가할까요?':'여행 후보에 담을까요?')+'</h2><p><strong>'+escape(place.name)+'</strong></p><div class="callout">'+(scheduled?'선택한 날짜의 일정에 추가돼요. 여행 후보로만 저장되는 것이 아니에요.':'이번 여행의 후보 목록에만 저장돼요. 날짜별 일정에는 들어가지 않아요.')+'</div>'+(scheduled?'<label class="mini" for="day">추가할 날짜</label><select id="day">'+trip.plan.days.map((d,i)=>'<option value="'+i+'">11월 '+(12+i)+'일</option>').join('')+'</select>':'')+'<div class="buttons"><button id="cancel" class="outline">취소</button><button id="approve" class="primary">'+(scheduled?'이 날짜에 추가':'후보에 추가')+'</button></div>';
$('modal').classList.remove('hidden');if(scheduled){$('day').value='1';$('day').onchange=e=>pending.dayIndex=Number(e.target.value)}$('cancel').onclick=close;$('approve').onclick=commit;}
function commit(){if(!pending)return;const action={...pending,verified:pending.type==='SCHEDULE'};try{const r=A.applyApproved(trip,action);trip=r.next;undo=r.undo;const kind=action.type,day=action.dayIndex,name=action.place.name;focus=kind==='SCHEDULE'?day:'candidates';notice={name,kind,day};close();view='trip';render();window.scrollTo({top:0,behavior:'instant'});}catch(e){const messages={ALREADY_CANDIDATE:'이미 여행 후보에 있어요.',ALREADY_IN_PLAN:'이미 일정에 들어간 장소예요.',INVALID_DAY:'날짜를 다시 선택해줘.',VERIFICATION_REQUIRED:'방문 가능 여부 확인이 필요해요.'};$('modalbody').insertAdjacentHTML('beforeend','<p role="alert">'+escape(messages[e.message]||e.message)+'</p>')}}
function resultMarkup(){if(!notice)return '';const scheduled=notice.kind==='SCHEDULE';return '<div class="result"><div class="eyebrow">완료 ✓</div><h3>'+escape(notice.name)+(scheduled?' 일정을 추가했어요':' 후보로 저장했어요')+'</h3><p>'+(scheduled?'11월 '+(12+notice.day)+'일 일정에 반영된 모습이 아래에 표시돼요.':'일정은 변경하지 않았어요. 아래 여행 후보 목록에서 확인할 수 있어요.')+'</p><div class="buttons"><button id="continue">'+(scheduled?'다른 장소 찾아보기':'추천 더 둘러보기')+'</button><button id="undo">되돌리기</button></div></div>'}
function drawTrip(){const c=counts();$('content').innerHTML='<div class="eyebrow">YOUR TRIP · PARIS</div><h1 class="headline">이번 여행</h1><p class="sub">여행 후보 '+c.c+'곳 · 일정 '+c.s+'곳</p><h2>여행 후보</h2><p class="mini">아직 날짜를 정하지 않은 장소</p>'+(trip.recommendationCandidates.length?trip.recommendationCandidates.map(p=>'<div class="slot"><strong>'+escape(p.name)+'</strong> <span class="mini">· 일정 미배치</span><div class="buttons"><button data-schedule="'+escape(p.placeId)+'">날짜 정해서 일정에 추가</button></div></div>').join(''):'<div class="callout">아직 여행 후보가 없어요.</div>')+'<h2 style="margin-top:27px">날짜별 일정</h2>'+trip.plan.days.map((d,i)=>'<div class="slot"><h3>11월 '+(12+i)+'일</h3>'+(d.items.length?d.items.map(p=>'<div>· '+escape(p.name)+'</div>').join(''):'<span class="mini">아직 정해진 장소가 없어요.</span>')+'</div>').join('')+'<div class="buttons"><button id="backExploration" class="primary">장소 더 찾아보기</button></div>';
$('content').querySelectorAll('[data-schedule]').forEach(b=>b.onclick=()=>{const p=trip.recommendationCandidates.find(x=>x.placeId===b.dataset.schedule);if(p)preview('SCHEDULE',p)});$('backExploration').onclick=()=>setView('explore')}
function drawRecs(){const fill=view==='slot';$('content').innerHTML='<div class="eyebrow">PARIS · DISCOVER</div><h1 class="headline">'+(fill?'비어 있는 오후, 어디로 갈까요?':'파리에서의 발견')+'</h1><p class="sub">'+(fill?'11월 13일 오후 일정에 추가할 장소를 골라봐요.':'마음에 드는 장소를 후보로 모으고, 원하는 날에 일정으로 옮길 수 있어요.')+'</p>'+places.map((p,i)=>{const inPlan=A.isInPlan(trip,p),candidate=A.inCandidates(trip,p);const main=fill?'이 시간에 추가':'여행 후보에 추가';const other=fill?'여행 후보에 추가':'일정에 추가';return '<article class="card"><span class="eyebrow">'+escape(p.kind)+'</span><h3>'+escape(p.name)+'</h3><p>'+escape(p.desc)+'</p><div class="buttons"><button class="primary" data-i="'+i+'" data-act="'+(fill?'SCHEDULE':'ADD_CANDIDATE')+'" '+(inPlan||(!fill&&candidate)?'disabled':'')+'>'+(inPlan?'이미 일정에 있음':!fill&&candidate?'후보에 추가됨':main)+'</button><button class="outline" data-i="'+i+'" data-act="'+(fill?'ADD_CANDIDATE':'SCHEDULE')+'" '+(inPlan||(fill&&candidate)?'disabled':'')+'>'+(inPlan?'일정에 있음':fill&&candidate?'후보에 추가됨':other)+'</button></div></article>'}).join('');
$('content').querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>preview(b.dataset.act,places[Number(b.dataset.i)]));}
function render(){$('explore').className=view==='explore'?'primary':'';$('slot').className=view==='slot'?'primary':'';$('trip').className=view==='trip'?'primary':'';const c=counts();$('count').textContent='('+(c.c+c.s)+')';$('confirmation').innerHTML=resultMarkup();if(view==='trip')drawTrip();else drawRecs();const ct=$('continue'),un=$('undo');if(ct)ct.onclick=()=>setView('explore');if(un)un.onclick=()=>{if(undo){trip=undo;undo=null;notice=null;focus=null;render()}};}
render();
})();
</script></body></html>
